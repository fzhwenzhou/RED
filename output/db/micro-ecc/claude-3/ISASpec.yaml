        uint32_t a[8], t[11];
        uint64_t c;
        int i;

        for (i = 0; i < 8; i++)
            a[i] = p256_fa[i];

        /* t = ACC * 2^64 mod 2^352 */
        t[0] = 0;
        t[1] = 0;
        for (i = 2; i < 11; i++)
            t[i] = p256_acc[i - 2];

        /* t += FA * x[rs2] at limb 0 */
        c = 0;
        for (i = 0; i < 8; i++) {
            c += (uint64_t)a[i] * in[1] + t[i];
            t[i] = (uint32_t)c;
            c >>= 32;
        }
        for (i = 8; i < 11; i++) {
            c += t[i];
            t[i] = (uint32_t)c;
            c >>= 32;
        }

        /* t += FA * x[rs1] at limb 1 */
        c = 0;
        for (i = 0; i < 8; i++) {
            c += (uint64_t)a[i] * in[0] + t[i + 1];
            t[i + 1] = (uint32_t)c;
            c >>= 32;
        }
        for (i = 9; i < 11; i++) {
            c += t[i];
            t[i] = (uint32_t)c;
            c >>= 32;
        }

        for (i = 0; i < 11; i++)
            p256_acc[i] = t[i];
        out[0] = 0;
        out[1] = 0;
    }
