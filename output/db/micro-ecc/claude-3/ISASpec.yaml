    X2 = (X1 mod 2^256) + floor(X1 / 2^256) * K
    X3 = (X2 mod 2^256) + floor(X2 / 2^256) * K
    X4 = (X3 mod 2^256) + floor(X3 / 2^256) * K      (0 <= X4 < 2^256 + 7*2^224)
