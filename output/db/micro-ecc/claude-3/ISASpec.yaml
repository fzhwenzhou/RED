- c_model: |
    #include <stdint.h>
    #include <string.h>

    /* Architectural accumulator, limb 0 least significant.  Volatile because
       other instructions write it in hardware. */
    static volatile uint32_t p256_acc[11];

    /* p = 2^256 - 2^224 + 2^192 + 2^96 - 1, plus a zero ninth limb */
    static const uint32_t P256_P9[9] = {
        0xFFFFFFFFu, 0xFFFFFFFFu, 0xFFFFFFFFu, 0x00000000u,
        0x00000000u, 0x00000000u, 0x00000001u, 0xFFFFFFFFu,
        0x00000000u
    };

    /* x <- (x mod 2^256) + (x >> 256) * K over 11 limbs, where
       K = 2^256 mod p = 2^224 - 2^192 - 2^96 + 1.  The high part T sits at
       h[7..9]; limb j gets +T[j] - T[j-3] - T[j-6] + T[j-7].  The carry is a
       floor division by 2^32, done as an exact division. */
    static void fold(uint32_t x[11])
    {
        uint32_t l[11], h[20];
        int64_t carry = 0;
        int j;

        for (j = 0; j < 8; j++)
            l[j] = x[j];
        l[8] = 0;
        l[9] = 0;
        l[10] = 0;
        for (j = 0; j < 20; j++)
            h[j] = 0;
        h[7] = x[8];
        h[8] = x[9];
        h[9] = x[10];
        for (j = 0; j < 11; j++) {
            int64_t v = carry + l[j] + h[j + 7] - h[j + 4] - h[j + 1] + h[j];
            uint32_t lo = (uint32_t)v;
            x[j] = lo;
            carry = (v - (int64_t)lo) / 4294967296LL;
        }
    }

    /* p256.red: ACC <- ACC mod p (canonical).  x[rs1], x[rs2] not read; rd <- 0. */
    void p256_red_model(const uint32_t in[2], uint32_t out[2])
    {
        uint32_t x[11], w[9];
        uint64_t b = 0;
        uint32_t keep;
        int i;

        (void)in;
        for (i = 0; i < 11; i++)
            x[i] = p256_acc[i];
        for (i = 0; i < 4; i++)
            fold(x);

        /* x < 2^256 + 7*2^224: one subtraction of p, kept by mask */
        for (i = 0; i < 9; i++) {
            uint64_t d = (uint64_t)x[i] - P256_P9[i] - b;
            w[i] = (uint32_t)d;
            b = d >> 63;
        }
        keep = (uint32_t)0 - (uint32_t)b;   /* all ones when x < p */
        for (i = 0; i < 8; i++)
            p256_acc[i] = (x[i] & keep) | (w[i] & ~keep);
        for (i = 8; i < 11; i++)
            p256_acc[i] = 0;
        out[0] = 0;
        out[1] = 0;
    }
