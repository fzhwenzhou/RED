    Suggested vectors:
    - left = right = p-1, which gives 1.
    - left = right = 2^256-1 (non-canonical).
    - left = right = 2^128, which gives 2^256 mod p.
    - left = 0.

    Invocations. 4 per uECC_vli_mult call: eight 32-bit digits of right, two per step.
