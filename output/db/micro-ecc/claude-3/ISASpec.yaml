  - FA
  - ACC
  replaces: uECC_vli_modSub::sub_borrow_fixup
  semantics: |
    p256.subm rd, rs1, rs2 sets ACC <- (FA - ACC[0..7]) mod p, using the convention of
    micro-ecc's uECC_vli_modSub:
    - D = (FA - ACC[0..7]) mod 2^256, with borrow bw; bw = 1 exactly when FA <
      ACC[0..7] as unsigned 256-bit integers.
    - ACC[0..7] <- (D + (p AND mask(bw))) mod 2^256, where mask(bw) is all ones when
      bw = 1 and zero otherwise. The carry out is discarded.
    - ACC[8..10] <- 0.
    For canonical inputs the result is canonical. For any other inputs it is exactly
    what uECC_vli_modSub computes, so the instruction is total.

    The p addend is masked, not branched on, and the latency is fixed. FA is unchanged.
    x[rd] <- 0; x[rs1] and x[rs2] are ignored (encode x0).

    Hardware. The adder of p256.red: an 8-limb subtract, then an 8-limb masked add,
    about 18 cycles.

    Use (uECC_vli_modSub when mod is secp256r1's p; other moduli keep the software
    path):
      p256.lda x0, left, left; p256.ldr x0, right, right; p256.subm x0, x0, x0;
      p256.str x0, result, result
    This is safe when result aliases left or right.

    Verification. From reset FA = ACC = 0, so Gate 2 sees x[rd] = 0 only. Run the
    sequence against uECC_vli_modSub. Suggested vectors:
    - left = right, which gives 0.
    - left = 0, right = 1, which gives p-1.
    - left = p-1, right = 0.
    - left = 0, right = 2^256-1 (non-canonical).
  spike_model: |-
    void p256_subm_iss(const uint32_t in[2], uint32_t out[2]) {
      // The model has no state: FA = ACC = 0 (reset), so a = s = 0, D = 0,
      // bw = 0, and ACC' = 0. x[rs1], x[rs2] are ignored; only x[rd] = 0
      // is observable.
      (void)in;
      out[0] = 0;
      out[1] = 0;
    }
  src_regs: 2
  state_words: 0
  words: 2
  writes_state:
  - ACC
link1_vectors: 100000
name: xp256
passes_gate2: true
passes_link1: true
rationale: |
  S2a (patterns, Amdahl). The report covers 97.2% of cycles in three loops that are
  all 256-bit prime-field arithmetic: vli_mmod_fast_secp256r1 (48.5%), uECC_vli_mult
  (42.5%) and uECC_vli_modSub (6.2%). The Amdahl ceiling is about 35x. mult and mmod
  run as a pair: every uECC_vli_modMult_fast/modSquare_fast does one of each, so both
  run 3,694,592 times. callgrind records mmod at 530,948 calls because it is reached
  through curve->mmod_fast, which is 6.96 reductions per recorded call.

  Shapes ruled out.
  - Pure 2-in/1-out primitives. Run 4b0bd1's add2lo/add2hi were blocked: at 28 cycles
    each they cost more than the RV32 ops they replaced. A Comba step needs a 3-word
    accumulator, and an mmod limb sums up to 10 product words.
  - The 16-word memory-to-memory compute blocks that shipped before (secp256r1.mult,
    mmod, modsub). Block compute is now blocking.
  - A one-shot register-only multiply (FP <- FA*FB) and a one-shot NIST reduction
    (FA <- FP mod p). These were this draft's first version. write_spec rejected them
    because a 2-word reg instruction run once cannot be the whole of a 1,028-IR
    (mult) or 8,168-IR (mmod) kernel. Its data-volume check does not see register-file
    operands.

  The design: interleaved (Horner) modular multiplication on two registers.
  - FA holds the multiplicand.
  - ACC holds the running residue.
  - Each mac2 folds in one 64-bit digit of the multiplier, taken from two GPRs:
    ACC <- ACC*2^64 + FA*b (16 MACs).
  - Each red brings ACC back to a canonical residue mod p, using only the sparse
    identity 2^256 = 2^224 - 2^192 - 2^96 + 1 (mod p). It needs no multiplier.
  - A modMult is: lda left; then 4 x (lw, lw, mac2, red) over right's digits from the
    top; then str result.
  - modSub is: lda left; ldr right; subm; str result.
  Compared with the one-shot version, this needs no 512-bit product register and no
  FB register, because the multiplier operand streams through GPRs. State drops from
  1024 to 608 bits. Each compute instruction does a fixed, small step that its two
  register operands can describe.

  The movers are the price of a load/store architecture on this bus. At 60 gate cycles,
  lda costs more than the eight LWs it resembles (about 48). It is still the cheapest
  way to put 256 bits into the unit: a register-fed alternative needs at least four
  28-cycle reg instructions plus the same LWs.

  Area.
  - FA + ACC = 608 flops, which is 19 of the 32 words red_accel's buffers already hold.
  - One 32x32 multiplier (red_accel's limb_product, reused), one 32-bit adder plus a
    4-input limb adder for the folds, and red_accel's bus master including its
    mem_issued guard.
  - Xp256 is meant to replace red_accel. It uses custom-1 only, so it never aliases
    red_accel's custom-0 encoding.
  - Compared with the baseline core it adds one 32x32 array. The core's fast_mul cannot
    be shared: a PCPI unit cannot issue to it while the CPU waits on pcpi_wait.

  Cost (gate model: 28 + 4*words + mac_ops):
  - lda/ldr/str: 60 each.
  - mac2: 44.
  - red, subm: 28 each.
  - modMult: 60 + 4*44 + 4*28 + 60 = 408 cycles vs 8,748 + 9,978 software. That leaves
    out the 8 LWs of right's digits (about 48 real cycles), which the gate does not
    model.
  - modSub: 208 cycles vs 1,203 software.
  - Predicted application speedup: about 16.9x, with invocations rounded up as below.
  - Estimated real hardware latency: mac2 about 18 cycles, red about 55, subm about 18,
    lda/ldr about 34, str about 18. That puts a real modMult at about 450 cycles.

  Invocations (integers; each from data volume).
  - mac2: 4 per uECC_vli_mult call. Eight 32-bit digits of right, two per step.
  - red: 28 per recorded mmod call. One red per mac2 gives 4 per reduction, and
    4 x 3,694,592 / 530,948 = 27.8.
  - subm: 1 per modSub call.
  - ldr: 1 per modSub call; only modSub uses it.
  - lda and str run once per modMult/modSquare and once per modSub: 7,633,920 times
    each. All of them are charged to the modSub loop, at
    (3,694,592 + 3,939,328) / 3,939,328 = 1.94, declared as 2.
  The per-loop rows are therefore skewed: modSub carries every mover and mult/mmod carry
  none. The application total is exact up to that rounding.

  S2c. All encodings are custom-1, with distinct funct3/funct7 values. Every instruction
  is total:
  - mac2 is defined mod 2^352.
  - red canonicalizes every 352-bit ACC.
  - subm reproduces uECC_vli_modSub, including non-canonical inputs.
  - Address bits [1:0] are ignored, and addresses wrap modulo 2^32.
  - Unassigned custom-1 encodings are not claimed; they time out on PCPI and trap as
    illegal.
  Latencies are fixed, and every conditional is a mask. subm and red hardwire the
  secp256r1 p, so callers with any other modulus keep the software path.
register_files:
- context: Not saved by hardware. Caller-saved scratch, dead after each leaf sequence. ENABLE_IRQ=0, so nothing preempts a sequence. An OS that adds preemption restarts the interrupted sequence from its p256.lda.
  count: 1
  name: FA
  purpose: Operand A, 8 x 32-bit limbs, limb 0 least significant (micro-ecc uECC_word_t[8] layout). It is the multiplicand of p256.mac2 and the minuend of p256.subm. Only p256.lda writes it.
  reset: zero
  width_bits: 256
- context: Not saved by hardware. Caller-saved scratch, dead after the p256.str that ends each leaf sequence. An OS that adds preemption saves it with p256.str (it is canonical, below 2^256, after every p256.red or p256.subm) and restores it with p256.ldr.
  count: 1
  name: ACC
  purpose: Accumulator, 11 x 32-bit limbs, limb 0 least significant. It holds the running residue of a modular multiply, and the subtrahend and then the result of p256.subm. p256.str stores its low 256 bits.
  reset: zero
  width_bits: 352
state_note: |
  FA and ACC live in the Xp256 unit, reset to zero, and are touched only by Xp256
  instructions.

  Every instruction is atomic. The CPU is stalled on pcpi_wait for its whole latency,
  and the core has ENABLE_IRQ=0, so no trap or interrupt can split one or preempt a
  sequence. Faults from other instructions leave FA and ACC unchanged.

  Software convention: FA and ACC are caller-saved scratch, and each leaf routine runs
  one straight-line sequence.
  - modMult/modSquare: lda; 4 x (lw, lw, mac2, red); str.
  - modSub: lda; ldr; subm; str.
  Nothing is live after it. p256.lda clears ACC, so every multiply starts from zero
  without an extra instruction.

  The movers make ordinary word accesses at the program's own privilege (machine mode;
  no MMU or PMP). They use red_accel's bus-master port while acc_busy holds the bus and
  follow its mem_issued rule, so the CPU's in-flight prefetch is never latched as data.

  Every instruction raises pcpi_wait in its first cycle (the timeout is 16 cycles) and
  has a data-independent latency.

  Gate 2 runs each instruction alone from reset, where FA = ACC = 0. It verifies the
  movers' copy path, but sees only zeros from mac2, red, subm and str. Those four are
  verified by the sequences in their semantics, which the reviewers should run against
  uECC_vli_modMult_fast and uECC_vli_modSub.
tests:
- 'link1: coverage 97.18% >= 80%; 6/6 C models built and survived 100,000 vectors under ASan+UBSan'
- 'gate2: 6/6 instructions: C model and patched Spike agree on 100,000 random + corner vectors'
version: '1.0'
