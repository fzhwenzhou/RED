description: 'Xp256: a P-256 field-arithmetic register extension for the red_core PicoRV32. Two declared registers: FA (256-bit operand A) and ACC (352-bit accumulator). Three load/store movers connect them to memory, and three register-only compute instructions do the arithmetic: a 256x64-bit Horner multiply-accumulate step whose digit comes from two GPRs, a reduction of the accumulator mod p, and a modular subtract. A modular multiply is software running lda, then four (mac2, red) pairs, then str. The extension replaces the work of uECC_vli_mult, vli_mmod_fast_secp256r1 and uECC_vli_modSub.'
