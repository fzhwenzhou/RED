    #include <stdint.h>
    #include <string.h>

    /* Architectural registers, limb 0 least significant.  Other instructions
       write them in hardware, so they are volatile here: this translation
       unit does not see every write. */
    static volatile uint32_t p256_fa[8];
    static volatile uint32_t p256_acc[11];

    /* p256.lda: FA <- in[0..7]; ACC <- 0; out[0..7] <- FA (copy-through). */
    void p256_lda_model(const uint32_t in[8], uint32_t out[8])
    {
        int i;
        for (i = 0; i < 8; i++)
            p256_fa[i] = in[i];
        for (i = 0; i < 11; i++)
            p256_acc[i] = 0;
        for (i = 0; i < 8; i++)
            out[i] = p256_fa[i];
    }
