- context: Per-hart secret architectural state. Save/clear with xword selectors 0..7 and restore with xword. stp, push, fold and pop clear A.
  count: 1
  name: A
  purpose: Eight little-endian 32-bit multiplicand limbs; lda loads upper six, two xword calls supply low two. Reduction moves and fold clear A.
  reset: All 256 bits zero.
  width_bits: 256
- context: Per-hart secret architectural state. Save/clear with xword selectors 8..23 and restore with xword. stp clears all limbs; the canonical sixteen-pop reduction drain consumes all limbs.
  count: 1
  name: C
  purpose: Sixteen little-endian 32-bit accumulator/product/reduction limbs. Multiplication is exact modulo 2^512; reduction steps preserve residue modulo the fixed P-256 prime.
  reset: All 512 bits zero.
  width_bits: 512
state_note: |-
  The only persistent extension state is A (256 bits) and C (512 bits): 24 words/768 bits. state_words=0 means no threaded state prefix in model operands. Every c_model carries identical guarded file-scope xp256_a[8] and xp256_c[16] declarations. Concatenate all snippets into ONE C99 translation unit for sequence modeling; the guard creates one shared instance. Separate compilation of snippets creates separate isolated machines, which cannot test cross-instruction effects. All state is zero on reset. Geometry and prime are fixed; csrs is intentionally empty, with no reliance on unavailable CSR-write support. The four-bit fold immediate selects a digit operation, not persistent configuration.
  The register-only instructions use at most two scalar sources and one scalar 32-bit result. They issue no memory transactions. lda and stp alone use the existing separate accelerator memory master and acc_busy bus mux; PCPI itself has no memory channel. Their full memory/overlap/address rules are in semantics. Assert pcpi_wait upon accepting any instruction, keep it asserted for long operations, and complete once using pcpi_ready/pcpi_wr, waiting for pcpi_valid to fall before reaccepting. CPU execution blocks throughout. Keep bus requests stable until acknowledged and preserve mem_issued against stale acknowledgement during ownership handoff. Match the complete custom-1/funct3/funct7 tuples and also fixed bit 24=0 for fold. Never assert external ready for base M or legacy custom-0 encodings.
  Reuse red_accel's current 32x32 limb multiplier and 64-bit accumulation/add datapath for mac2 and signed fold microsteps; do not add a second new multiplier or divider. Map A onto operands[0..7] and C onto product_words[0..15]; this uses 768 of the existing 1024 buffer bits. Sampled operands, address, carry and controller registers are temporary and cleared on completion. Physical area and timing require synthesis; buffer counts alone are not an area measurement. Existing custom-0/funct3=000/funct7=000 keeps its original product encoding and memory result but clobbers the shared new state; finish it with A=C=0. A caller with live new-extension state must save it before invoking legacy multiplication.
  These are caller-clobbered per-hart registers. The target disables IRQs, but scheduling or synchronous trap handling between instructions must save and clear all 24 words via xword before another security context runs and restore them before resuming. xword(v,k) exchanges word k with v, so xword(0,k) both returns and erases each saved word. Protect and erase the software context image as for base register secrets. No context switch occurs inside a stalled PCPI operation. stp clears A/C only after its last acknowledged store. Sixteen pops following the specified sixteen folds consume all of C and clear A; arbitrary unfinished sequences require explicit context cleanup. Reset clears in-flight and architectural state. Bus faults/waits inherit the target's behavior; no new memory protection or fault channel is implied.
tests:
- 'link1: coverage 90.95% >= 80%; 7/7 C models built and survived 100,000 vectors under ASan+UBSan'
- 'gate2: 7/7 instructions: C model and patched Spike agree on 100,000 random + corner vectors'
