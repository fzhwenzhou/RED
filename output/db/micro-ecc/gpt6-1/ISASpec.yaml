link1_vectors: 100000
name: xp256_steps
passes_gate2: true
passes_link1: true
rationale: |-
  S2a / source evidence. The report names only vli_mmod_fast_secp256r1::fold_and_normalize (share 0.4848706021140489, 4336800805 host callgrind events, 530951 recorded calls) and uECC_vli_mult::comba_product (share 0.4246351870290038, 3798040576 events, 3694592 calls). Their ideal combined Amdahl ceiling is 11.05043x from 90.95058% coverage; reduction alone caps at 1.94126x and multiplication alone at 1.73803x. These are upper bounds, not achieved measurements. The generalized patterns are carry-propagating convolution and fixed-prime high-digit elimination. No benefit is claimed for unmined modSub, add or inversion. micro-ecc/types.h defaults RV32 to 32-bit words and curve-specific.inc defines P-256 as 32 bytes/eight such words and supplies p=2^256-2^224+2^192+2^96-1. The profile does not identify effective host macros or runtime num_words distribution; dispatch the multiply sequence for logical 256-bit inputs (num_words=8 on RV32), retaining software for other sizes. Full reported coverage is an eligibility ceiling until that histogram is known.

  S2b / history and partition. Start from the shipped p256.mac2 shape (reg, words=2, 16 multiplies per call, four calls). Preserve it while expanding C from the older 352-bit state to 512 bits: standalone uECC_vli_mult requires all product limbs, and a previously observed high-state truncation defect forbids claiming arbitrary-state modular equivalence for a narrow accumulator. The new mac2 explicitly defines modulo 2^512, and its four-call product does not overflow that width. Memory-to-memory compute monoliths and the formerly rejected tiny add2 pair are excluded. Arithmetic is now either register compute or register/immediate reduction, and only the load-store pair addresses memory. A 16-bit reduction digit is small enough to give a constant two-pass carry-elimination proof for every 512-bit state. Sixteen fixed steps leave the reduction loop in software. The final scalar insertion/extraction shape also respects the writer's minimum-invocation heuristic using real data counts, without inflating a one-load-per-kernel declaration. The six-word upper-multiplicand load plus two xword calls gives explicit state access real kernel work and satisfies the positive/helper invocation checks. This costs extra issue cycles and is included below.

  Exact standalone multiplication wrapper (byte pointers):
    lda x0, left+8, scratch6
    LW a0=left[0]; xword x0,a0,selector0
    LW a1=left[1]; xword x0,a1,selector1
    for k=3,2,1,0: LW lo=right[2*k]; LW hi=right[2*k+1]; mac2 x0,lo,hi
    stp x0,product,product
  A word is 4 bytes. lda moves the upper 24 operand bytes directly and writes a six-word scratch output; xword supplies the other 8 bytes, one limb per invocation. Thus lda=1, xword=2, mac2=8/2=4, stp=1. mac2 performs 4*16=64 32x32 products and stp returns the full 16-word product. left/right are separate arrays; no concatenation is required. All operand reads precede the final store, so standard destination aliases are safe. Use scratch6 distinct from unread operands; if the upper-left input is writable SRAM, exact copy-through alias is also allowed.

  Exact standalone reduction wrapper:
    for i=15 down to 0: LW t=product[i]; push x0,t,x0
    for k=15 down to 0: fold x0,x0,k
    for j=0..7: lo=pop(); hi=pop(); SW result[j]=lo|(hi<<16)
  There are 64/4=16 push calls, 256 high bits/16=16 fold calls, and 32 result bytes/2=16 pop calls. Sixteen pushes replace ANY prior C; there is no hidden initialize operation. The fold order is public and fixed and can be sixteen unrolled immediate instructions. After the last pop A=C=0. All sixteen LW occur before output stores, so product/result overlap is supported. In a known P-256 modMult caller, software may omit stp and the sixteen input pushes and reduce the live product; costing here conservatively keeps both standalone wrappers, without double-crediting fused execution. Helpers share their kernel's measured share; sum all their costs before calculating speedup. Each replaces field uses an exact current loop_id, and every declared invocation count describes the stated wrapper. marshal_words=0 means no CPU block copies: lda's source is the existing six-word suffix, stp's output is the caller's existing sixteen-word buffer, and the reduction transfers use ordinary scalar registers. Scalar loads, packing instructions and stores are still charged separately.

  Target cost and uncertainty. Use issue=28, never the core's bare handshake=1. The six-word block load costs 28+4*6=52; stp costs 92; mac2 costs 44; xword, push, pop and fold cost 28 each in the stated gate formula. Multiplication is 52+2*28+4*44+92=376 gate cycles plus ten scalar LW at the core's 7-cycle estimate =446 before wrapper control. Four fixed MAC carry tails/shift steps add approximately 64 implementation cycles, giving a 510-cycle planning figure plus control. Reduction is (16+16+16)*28=1344 gate cycles, plus sixteen scalar LW (112), eight scalar SW (40 using the supplied 5-cycle store calibration), eight OR, and eight iterative shift-by-16 operations; the CPU has no barrel shifter. Gate mac_ops=0 does not make folding free. A conservative serial controller budget is 416 additional microcycles per fold for two fixed digit passes, selected-digit capture and two modulus-subtraction scans, giving 8000 extension cycles plus CPU transfers/packing/control (roughly 8.25k before loop/setup if packing takes about 96 cycles). This is a budget to validate in RTL, not measured latency. The persistent 768 bits are substantial versus 992 writable CPU register bits, but reuse existing buffers. No synthesized area claim, extra multiplier, asynchronous overlap, or new memory channel is assumed.
  Callgrind host events are not target cycles; 8.5 target cycles per host event is calibration only. The recorded indirect reduction call count is much lower than multiplication's, so do not import the historical about-seven correction factor as a measured kernel trip count. Invocation counts above come from bytes. Any performance extrapolation must additionally check sensitivity to approximately 3694592/530951=6.96 times the recorded reduction count and resolve attribution before claiming application speedup.

  S2c round 1, arithmetic/totality. MAC intermediates fit uint64: one 32x32 product plus a 32-bit destination and carry is at most 2^64-1. Arbitrary accumulator overflow is explicitly modulo 2^512. Fold's h is an existing 16-bit digit; each pass replaces h*T with smaller h*Q, so it is nonnegative, cannot overflow 512 bits, and preserves residue. Two passes remove the digit in descending order even when the first reintroduces a carry. The proof and exact conditional subtraction are in semantics. Intermediate signed magnitude is below 4*65536; a positive bias implements floor carry without implementation-defined signed shifts. p>2^255 makes one final subtraction enough after k=0. C-model high immediate bits and invalid xword selectors are defined, all outputs are assigned, and all scalar padding is zero.

  S2c round 2, timing/state/security. Every loop has a constant geometry-bound trip count. No model branch or address depends on input values: fold finds its immediate-selected digit with equality masks over fixed locations, and xword scans all 24 state locations. Signed intermediates are bounded, all shifts are by 0,16,32 or63, and unsigned subtraction wraps by C99 rules. There is no libc, undeclared state, input write, or block overrun. All C models support in==out because used scalar inputs are captured before output, lda loads its full block before echoing, and stp ignores input values. stp and a complete normalized pop drain clear secrets; xword supports exact state save/clear/restore rather than relying on reset-only tests. A complete reduction changes every persistent word even when entry state was arbitrary.

  S2c round 3, decode/callability/core. All seven triples are unique custom-1 encodings ending in 0101011, with fully specified funct3/funct7. fold additionally fixes bit24=0 and consumes only imm4; no alias with custom-0 legacy multiply or opcode0x33 M instructions exists. Block widths are 6 and16, both load-store; the remaining operations are register moves, compute or reduction, words=2, state_words=0. There are no new CSRs or hidden configuration. PCPI blocking, prompt wait, stable acknowledged memory transactions and the ownership guard are mandatory. Only one scalar result is returned; 512-/256-bit results are drained explicitly. All data volume, output sizing, shifts and setup instructions are accounted for.

  Executed design checks and verification boundary. A JavaScript limb simulation checked the exact mac2 algorithm against independent BigInt equations for 20000 arbitrary initial accumulators and 20049 product sequences including all-ones, zero, p-1 and power-of-two cases. The final digit-fold/move algorithm passed 1036 directed full reductions (including every isolated bit and adjacent power-of-two threshold, p,2p,p^2,(p-1)^2,all-ones), 20000 random 512-bit push/fold/pop sequences, 20000 arbitrary-state/immediate fold cases, and 20000 xword context save/clear/restore tests with invalid selectors. These are arithmetic/design checks, not C compilation, sanitizers, constant-time instrumentation, ISS or RTL tests.
  The sealed tool surface exposes no compiler, sanitizer or evaluation runner. Isolated Gate 2 starts state at zero and does not verify nonzero mac2/fold/pop transitions; affected semantics explicitly disclose this limitation. For integration, concatenate models into one shared-state C99 translation unit, then compare the full multiplication wrapper against an independent 512-bit product and the full reduction wrapper against X mod p. Compare the fused wrapper against a*b mod p. Seed every limb via xword for arbitrary-state tests; test upper immediate bits in the array model, illegal encoded bit24, all state selectors, context switches at every instruction boundary, exact/partial block overlaps, output poisoning, repeated post-drain reads, memory stalls and stale-ready handoff. The independent ISS/RTL implementations must pass these sequence tests before a hardware shipping claim.
  Final wrapper recheck after the accepted operand-setup revision: 20000 additional deterministic random sequences passed six-word lda plus two xword setup, four exact mac2 steps, full product store/clear, sixteen scalar pushes, descending digit folds, and sixteen-digit drain against independent BigInt product and modulo-p results. This remains a JavaScript design check, not an executable C/ISS gate result.
