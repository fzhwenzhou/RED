findings:
- check: agent.residue
  confidence: agent
  evidence: The shared static xp256_a/xp256_c arrays persist across instruction calls; xword selects and returns an input word while updating its selected state limb, and the prose explicitly says xword can expose all state for context save/clear/restore. lda/stp clear state only at their specified sequence points, and a single instruction is non-interruptible but the multi-instruction sequence can be preempted between instructions. Probes are single-instruction, reset-state runs and cannot establish a cross-call read, so this remains advisory.
  finding: A later unprivileged caller on the same hart can read the previous caller's secret multiplicand or accumulator by selecting its A/C limb with xword whenever the prior operation yields or exits before lda, stp, or a complete 16-pop drain clears that state.
  fix: Make A/C state inaccessible to user-level instructions or tag and clear it on privilege/context changes; alternatively require the privileged context-switch path to save and zero the entire state before scheduling another caller, including interrupted sequences.
  instruction: p256.xword
  severity: major
vectors: 512
