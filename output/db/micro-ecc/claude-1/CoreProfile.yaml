area_note: 'Baseline core (PicoRV32 + fast_mul + div, no accelerator) synthesizes to 5,590 iCE40 LUT4, 3,816 flip-flops and 18,089 generic cells (eval/RESULTS.md). Architectural state is about 1 kbit of register file, 5x32-bit datapath registers, 128 bits of counters, about 260 bits in fast_mul and about 160 bits in div. A 16-word buffer is 512 flops, about 13% of the core''s flops: noticeable, not dominant. The shipped micro-ecc accelerator (32 words of buffer plus a 32x32 multiplier) took the core to 9,873 LUT4 and 6,604 FFs, +77% and +73%. A second 32x32 multiplier costs on the order of 1,000 LUT4 on iCE40 because there are no DSPs. ''Large'' means you have doubled the core.'
constraints:
- The PCPI interface by itself cannot access memory. Memory operands are reachable only through red_core's added bus-master port, and only while the unit holds busy=1 and the CPU is stalled on pcpi_wait.
- There is no bus arbiter. The accelerator must raise busy before driving the bus and hold it for every beat. mem_ready reaches it as (busy && mem_ready).
- On taking the bus, ignore the first mem_ready. The CPU's instruction prefetch is usually already in flight, and its ready shows up in the first busy cycle. red_accel's mem_issued flag exists to do exactly this; copy that pattern.
- Assert pcpi_wait (or pcpi_ready) within about 15 cycles of pcpi_valid. Otherwise the 4-bit pcpi_timeout_counter fires and the CPU traps (CATCH_ILLINSN=1).
- pcpi_ready must be a one-cycle pulse. The unit must not restart until pcpi_valid has dropped, as in red_accel's S_WAIT state. pcpi_valid is still high in the cycle the CPU accepts ready.
- Only 2 register operands in and 1 register result (32 bits) out per instruction.
- The bus is 32-bit, one word per 2 cycles at best, with no bursts. An N-word operand block costs at least 2N cycles, plus about 3 cycles for the first beat.
- The accelerator's accesses are not checked for alignment or range. Any address outside 0x0-0x3FFFF and the 3 MMIO registers is fatal in red_soc_tb. Word addresses must be 4-byte aligned; only wstrb masks partial writes.
- 'Fixed cost per custom instruction: about 2 cycles from instruction launch until the unit sees pcpi_valid, and about 3 to 5 cycles after pcpi_ready before the next instruction issues (writeback, bus handback, refetch). A single-cycle register-only PCPI op costs about 5 cycles against 4 for a native ALU op. A memory-mastering op adds about 3 more.'
- Software competes with a 4-cycle ALU, a 7-cycle load/store and a 6-cycle hardware 32x32 MUL/MULH. Do not price a multiply as cheap software, and don't duplicate the multiplier without counting about 1k LUT4.
- No interrupts (ENABLE_IRQ=0), so a long-running custom instruction is never preempted, and nothing else can recover the CPU if the unit hangs.
- custom-0 funct3=000/funct7=0000000 is occupied by the shipped red_accel. A new instruction must either decode a different encoding or replace red_accel.
coprocessor: PicoRV32 PCPI (pcpi_valid, pcpi_insn[31:0], pcpi_rs1, pcpi_rs2 -> pcpi_wr, pcpi_rd, pcpi_wait, pcpi_ready). Any instruction the decoder doesn't recognise (instr_trap) is put on PCPI from ld_rs1. Both rs1 and rs2 are valid in the same cycle, and the full 32-bit instruction word is available, so funct3, funct7 and the rs/rd field bits can serve as sub-opcodes. On its own, PCPI only carries register values in and one register value out. It cannot reach memory. In this project, red_core adds a bus-master port for the accelerator (mem_valid, mem_addr, mem_wdata, mem_wstrb out; mem_rdata, mem_ready in; plus a busy signal). While busy=1 the accelerator owns the shared memory bus, and cpu_mem_ready is forced to 0. This is safe only because the CPU is stalled in ld_rs1 waiting on pcpi_wait. There is no arbiter. A 1-bit mux selects on busy.
coprocessor_issue_overhead: 2
coprocessor_memory_access: true
coprocessor_result: 'One 32-bit value per instruction, on pcpi_rd, written to rd only if pcpi_wr=1 in the cycle pcpi_ready=1. pcpi_ready must be a one-cycle pulse. Wider results have to go to memory through the red_core bus-master port, as the shipped red_accel does: it writes a 16-word block and returns rd=0.'
custom_opcode_space:
- 'custom-0 0001011: reaches PCPI because ENABLE_IRQ=0 turns off PicoRV32''s own getq/setq/retirq/maskirq/waitirq/timer decode on this opcode. funct3=000 with funct7=0000000 is taken by the shipped red_accel. Every other funct3/funct7 combination is free.'
- 'custom-1 0101011, custom-2 1011011, custom-3 1111011: not decoded by the core, so they reach PCPI as instr_trap. Free.'
- Do not use opcode 0110011 (OP) with funct7=0000001. pcpi_fast_mul and pcpi_div claim it, and PCPI's wait and ready signals are ORed across units, so two responders would corrupt each other.
cycles_per_alu_op: 4
cycles_per_load: 7
cycles_per_word_moved: 2
evidence:
- 'Instantiation used: rtl/red_core.v instantiates picorv32 with ENABLE_COUNTERS=1, ENABLE_MUL=0, ENABLE_FAST_MUL=1, ENABLE_DIV=1, ENABLE_PCPI=ENABLE_ACCEL, ENABLE_IRQ=0, COMPRESSED_ISA=0, STACKADDR=0x20000. rtl/red_soc_tb.v instantiates red_core with ENABLE_ACCEL=1 (default). I chose these over the vendor testbenches in picorv32/scripts/* and picorv32/testbench*.v because they belong to this project and are wired to red_accel.'
- 'Unoverridden picorv32 defaults (picorv32.v:62-88): ENABLE_REGS_16_31=1, ENABLE_REGS_DUALPORT=1, TWO_STAGE_SHIFT=1, BARREL_SHIFTER=0, TWO_CYCLE_ALU=0, CATCH_ILLINSN=1, CATCH_MISALIGN=1, ENABLE_COUNTERS64=1.'
- 'PCPI port: picorv32.v:110-117. pcpi_rs1=reg_op1, pcpi_rs2=reg_op2 (191-192). pcpi_insn <= mem_rdata_q (1038). The internal and external units'' wait and ready are ORed, and rd is chosen by ready priority (325-346).'
- 'Dispatch: instr_trap = not any recognised instruction (679-685). ld_rs1 with dual-port sets pcpi_valid and accepts pcpi_int_ready (1585-1613). custom-0 IRQ instructions are gated by ENABLE_IRQ (871-872, 1090-1093).'
- 'Timeout: reg [3:0] pcpi_timeout_counter (1215) counts down while pcpi_valid && !pcpi_int_wait (1423-1429).'
- 'Memory FSM: picorv32.v:565-636 (mem_state 0/1/2/3, prefetch held in state 3). ldmem and stmem: 1854-1912. Cycle counts are traced by hand from these together with red_soc_tb''s registered mem_ready. I could not run the simulation; the iverilog microbenchmark run.sh needed approval and was not run.'
- 'Bus mux and the accelerator port: red_core.v (acc_busy selects mem_*; cpu_mem_ready=0 while busy; accelerator mem_ready = acc_busy && mem_ready).'
- 'red_accel.v: decodes opcode 0001011, funct3 000, funct7 0000000. mem_issued/beat_done logic, S_WAIT on !pcpi_valid, 16+16 word buffers, combinational 32x32 multiplier. The 139-cycle instruction latency in eval/RESULTS.md matches about 33 load + 72 MAC/carry + 32 store cycles.'
- 'fast_mul: picorv32.v:2318-2413 (33x33 multiply registered into rd, ready at active[1]). div: 2420-2510 (quotient_msk shifts 1 bit per cycle).'
- 'SRAM timing and memory map: red_soc_tb.v always block (mem_ready <= 1 only when mem_valid && !mem_ready; MEM_WORDS=65536; MMIO at 0x10000000/4/8; $fatal on unmapped).'
- 'Area: eval/RESULTS.md lines 43-45 (baseline 5,590 LUT4 / 3,816 FF / 18,089 cells; micro-ecc extended 9,873 / 6,604 / 28,682) and line 90 (libcrc accelerator alone 1,002 LUT4).'
existing_units:
- 'picorv32_pcpi_fast_mul: one 33x33 signed multiplier, a single-cycle array with registered input and output (EXTRA_MUL_FFS=0). Handles opcode 0110011 with funct7 0000001 and funct3 000-011. About 6 cycles per MUL instruction. Present in both the baseline and the extended core.'
- 'picorv32_pcpi_div: sequential restoring shift-subtract divider, one quotient bit per cycle, 32 iterations. 63-bit divisor register plus 32-bit dividend, quotient and mask registers. Handles funct3 100-111 of the same opcode. About 38 cycles.'
- 'Shifter: iterative, not a barrel shifter. TWO_STAGE_SHIFT=1 steps 4 bits, then 1 bit, per cycle.'
- 'ALU: single-cycle 32-bit add, sub, compare and logic (TWO_CYCLE_ALU=0, TWO_CYCLE_COMPARE=0).'
- 64-bit cycle and instret counters (ENABLE_COUNTERS64 default 1).
- 'red_accel (when ENABLE_ACCEL=1): the micro-ecc 256x256 multiply on custom-0, funct3=000, funct7=0000000. It has its own combinational 32x32->64 multiplier and 32 words of operand and product flops. This is what the current extension slot holds.'
isa: 'RV32IM. The M extension comes from the internal PCPI units picorv32_pcpi_fast_mul (MUL/MULH/MULHSU/MULHU) and picorv32_pcpi_div (DIV/DIVU/REM/REMU). Also present: rdcycle[h] and rdinstr[h] with 64-bit counters, and FENCE (does nothing). Not present: C extension, IRQs and the PicoRV32 q-register instructions, any other CSRs. Illegal instructions trap (CATCH_ILLINSN=1). Misaligned loads, stores and instruction fetches trap (CATCH_MISALIGN=1). ECALL and EBREAK trap.'
memory_interface: 'Native PicoRV32 valid/ready interface: 32-bit addr, rdata and wdata, 4-bit wstrb. One transaction at a time, no bursts, no look-ahead port on red_core. red_soc_tb memory: SRAM at 0x0 to 0x3FFFF (65,536 words), registered. It raises mem_ready the cycle after it sees mem_valid, then must see mem_ready low for a cycle, so one word takes 2 cycles. MMIO: 0x10000000 write = putchar, 0x10000004 write = exit, 0x10000008 read = cycle counter. Any other address triggers $fatal in simulation. Reset PC is 0x0, stack starts at 0x20000.'
microarchitecture: 'Multi-cycle, not pipelined. One cpu_state FSM runs fetch -> ld_rs1 -> exec, shift, ldmem or stmem -> fetch. The register file is dual-port, so ld_rs1 reads rs1 and rs2 in the same cycle. The only overlap is prefetching the next instruction during ld_rs1 and exec. Every bus transaction costs 2 cycles on this SRAM. Worked out from the FSM: ALU reg-reg and reg-imm take 4 cycles, loads and stores 7, fast MUL about 6, DIV/REM about 38, shifts 5 to about 12 (TWO_STAGE_SHIFT steps 4 bits then 1 bit; BARREL_SHIFTER=0). The vendor README gives 3/5/5 for memory that answers in the same cycle; this SRAM adds about 1 cycle per bus transaction.'
name: 'PicoRV32 inside red_core (rtl/red_core.v), as instantiated by rtl/red_soc_tb.v with ENABLE_ACCEL=1: ENABLE_FAST_MUL=1, ENABLE_DIV=1, ENABLE_PCPI=1, ENABLE_IRQ=0, COMPRESSED_ISA=0, ENABLE_COUNTERS=1. The PCPI accelerator also gets its own bus-master port through a 1-bit mux. Memory is a 256 KiB SRAM that answers one cycle after a request, plus MMIO.'
register_file: 32 x 32-bit (x0 hardwired to zero, so 31 storage registers). ENABLE_REGS_16_31=1. 2 read ports and 1 write port (ENABLE_REGS_DUALPORT=1). A PCPI instruction gets at most 2 source register values (rs1, rs2) and writes at most 1 destination (rd).
