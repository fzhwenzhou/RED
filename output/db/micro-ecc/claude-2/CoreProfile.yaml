area_note: 'Core state: a 1024-bit register file (32x32) plus roughly 700 other flops (estimate). Those include pc/next_pc, reg_op1/op2/out/sh, mem_addr/wdata/rdata_q, decoded fields/immediates and 128 counter bits. fast_mul adds about 200 flops and a 33x33 multiplier. div adds about 160 flops. A 16-word buffer is 512 flops: half of the entire register file, and about as large as all of the CPU''s other control and datapath flops together. That is large next to this core. The current red_accel holds 1024 bits of buffers plus 64 bits of addresses and a 32-bit carry, so it is about as big as the CPU. Both the baseline and extended builds include the fast multiplier, so a second 32x32 multiplier inside the extension adds its area again.'
constraints:
- PCPI gives the accelerator only 2 register values (rs1, rs2) and the instruction word, and takes back at most one 32-bit rd. There is no rs3 and no second destination.
- Plain PCPI cannot access memory. The only memory path is red_core's bus-master port, which can be used only while the instruction is in flight (busy=1) and the CPU is stalled. CPU and accelerator never run concurrently, so every accelerator cycle shows up in total runtime.
- 'The bus is single-ported and shared: 2 cycles per 32-bit word, no bursts. Moving 16 words in and 16 out costs about 64 cycles before any compute.'
- When the accelerator takes the bus, the CPU's prefetch may still be in flight, and its response arrives on the shared mem_rdata. The accelerator must discard the first ready after asserting mem_valid (red_accel's mem_issued pattern), or it will read the instruction word as data.
- pcpi_wait must be asserted within 15 cycles of pcpi_valid. Otherwise the CPU's pcpi_timeout fires and it traps (CATCH_ILLINSN=1).
- After pcpi_ready, the accelerator must hold its state until pcpi_valid drops (red_accel's S_WAIT), and busy must stay high until then so the CPU's next fetch does not collide.
- The decoder must reject OP/funct7=0000001 (MUL/DIV), because fast_mul and div see the same pcpi_valid. External PCPI wins the result mux, so a decode overlap silently corrupts MUL/DIV.
- A single-cycle hardware multiplier already exists. Software MUL/MULHU costs about 6-7 cycles, so a custom instruction must win on bundling, data movement or carry handling, not on the 32x32 multiply itself.
- No barrel shifter. Multi-bit shifts and rotates are slow in software (up to about 10 extra cycles), and logic there is cheap.
- Accelerator memory accesses bypass CATCH_MISALIGN and have no bounds check. An address outside 0x0-0x3FFFF (other than the 3 MMIO registers) is $fatal in simulation. Pointers in rs1/rs2 must be range- and alignment-checked or explicitly trusted.
- The baseline (ENABLE_ACCEL=0) and extended builds differ only in red_accel plus the PCPI/bus mux. All measured cycle and area differences are charged to the extension.
coprocessor: 'PCPI. In ld_rs1 the CPU raises pcpi_valid and drives the full instruction word (pcpi_insn) and the values of rs1 and rs2 (pcpi_rs1, pcpi_rs2). Every PCPI unit sees the same pcpi_valid: red_accel, fast_mul and div. A unit claims the instruction by asserting pcpi_wait, and finishes with a one-cycle pcpi_ready plus pcpi_wr/pcpi_rd. The CPU stays stalled in ld_rs1 the whole time. PCPI by itself cannot reach memory. In THIS build, red_core.v gives the accelerator its own bus-master port (mem_valid/addr/wdata/wstrb/rdata/ready). A 1-bit mux on ''busy'' (red_accel state != S_IDLE) gives it the single memory bus. The CPU is blocked (cpu_mem_ready=0) while busy is high. The accelerator can therefore address memory, but only while the CPU is stalled on that instruction, and never in parallel with the CPU.'
coprocessor_issue_overhead: 2
coprocessor_memory_access: true
coprocessor_result: One 32-bit value (pcpi_rd), written to rd only if pcpi_wr=1. It is sampled in the same cycle as pcpi_ready. External PCPI has priority in the pcpi_int_* mux. There is no second destination register and no flags. A wider result has to be written to memory through the accelerator's bus-master port; the current red_accel writes 16 words and returns rd=0.
custom_opcode_space:
- 'custom-0 0001011 (0x0B): currently decoded by red_accel only for funct3=000, funct7=0000000. Other funct3/funct7 values are free. ENABLE_IRQ=0, so PicoRV32''s getq/setq/retirq/maskirq/waitirq/timer encodings in this opcode are NOT decoded and do not collide.'
- 'custom-1 0101011 (0x2B), custom-2 1011011 (0x5B), custom-3 1111011 (0x7B): not decoded by the core, so they become instr_trap and go to PCPI. red_core''s accelerator only decodes custom-0 today.'
- 'Off limits: OP 0110011 with funct7=0000001. fast_mul and div both listen on pcpi_valid for these encodings.'
cycles_per_alu_op: 4
cycles_per_load: 7
cycles_per_word_moved: 2
evidence:
- 'Configuration: rtl/red_core.v instantiates ''picorv32 #(.ENABLE_COUNTERS(1), .ENABLE_MUL(0), .ENABLE_FAST_MUL(1), .ENABLE_DIV(1), .ENABLE_PCPI(ENABLE_ACCEL), .ENABLE_IRQ(0), .COMPRESSED_ISA(0))'' with ENABLE_ACCEL default 1. I chose this over the vendor testbenches (picorv32/testbench*.v, scripts/*, picosoc) because it is this project''s wrapper and the one wired to red_accel. rtl/red_soc_tb.v instantiates red_core and does not override the CPU parameters.'
- 'Defaults not overridden (picorv32.v:63-88): ENABLE_REGS_16_31=1, ENABLE_REGS_DUALPORT=1, BARREL_SHIFTER=0, TWO_STAGE_SHIFT=1, TWO_CYCLE_ALU=0, TWO_CYCLE_COMPARE=0, CATCH_ILLINSN=1, CATCH_MISALIGN=1, ENABLE_COUNTERS64=1.'
- 'Bus mux: red_core.v ''assign mem_addr = acc_busy ? acc_mem_addr : cpu_mem_addr; assign cpu_mem_ready = acc_busy ? 1''b0 : mem_ready''. busy is ''state != S_IDLE'' (red_accel.v).'
- 'PCPI dispatch: picorv32.v:1585-1603. In ld_rs1 with instr_trap: pcpi_valid<=1, and on pcpi_int_ready: reg_out<=pcpi_int_rd, latched_store<=pcpi_int_wr. Result priority mux at picorv32.v:325-346.'
- 'Timeout: picorv32.v:1423-1429, a 4-bit pcpi_timeout_counter that counts down while pcpi_valid && !pcpi_int_wait.'
- 'Fast multiplier: picorv32.v:2345 decodes opcode 0110011/funct7 0000001. picorv32.v:2371 does ''rd <= $signed(rs1)*$signed(rs2)''. pcpi_ready=active[1] (2401-2403).'
- 'Divider: picorv32.v:2444-2480, sequential, quotient_msk starts at 1<<31 and shifts each cycle.'
- 'custom-0 is free: picorv32.v:1090-1093 and 871-872 decode IRQ instructions only when ''&& ENABLE_IRQ''. instr_trap (679-685) sends everything else to PCPI.'
- 'Memory timing: red_soc_tb.v ''mem_ready <= 0; if (mem_valid && !mem_ready) mem_ready <= 1'', which gives 2 cycles per beat. red_accel.v beat_done = mem_valid && mem_issued && mem_ready discards the in-flight CPU response.'
- 'Cycle estimates are derived by hand from the fetch/ld_rs1/exec/ldmem state machine (picorv32.v:1491-1912) and the memory state machine (581-620), assuming the SoC''s 1-wait-state SRAM: about 4 cycles per ALU op and about 7 per load. Issue overhead: decode -> pcpi_valid takes 1 cycle and pcpi_valid -> red_accel latching rs1/rs2 takes 1 more, total 2. The first accelerator data word lands about 4 cycles after pcpi_valid because of the discarded prefetch beat. Returning to the CPU adds about 2-3 cycles: S_DONE -> CPU sees ready -> S_WAIT -> idle, then a new fetch. These are not measured; measured accelerator latency comes from tb_accel.v.'
existing_units:
- '32-bit single-cycle ALU: adder/subtractor and comparator (TWO_CYCLE_ALU=0, TWO_CYCLE_COMPARE=0)'
- 'Sequential shifter, no barrel shifter (BARREL_SHIFTER=0, TWO_STAGE_SHIFT=1): 4 bits per cycle, then 1 bit per cycle, costing up to about 10 extra cycles'
- 'Fast multiplier picorv32_pcpi_fast_mul: one 33x33 signed array multiply in one clock (''rd <= $signed(rs1)*$signed(rs2)''), result 2 cycles after pcpi_valid, covers all of MUL/MULH/MULHSU/MULHU'
- 'Divider picorv32_pcpi_div: sequential restoring divider, 1 quotient bit per cycle, 32 iterations, about 160 flops (dividend 32, divisor 63, quotient 32, mask 32)'
- Two 64-bit counters (count_cycle, count_instr)
- 'red_accel: the extension''s own slot, which is being replaced. It currently holds its own 32x32->64 multiplier, 16x32 operand buffer, 16x32 product buffer and a bus master'
isa: RV32IM plus 64-bit rdcycle/rdcycleh/rdinstr/rdinstrh counters (ENABLE_COUNTERS=1, ENABLE_COUNTERS64 default 1). MUL/MULH/MULHSU/MULHU come from picorv32_pcpi_fast_mul. DIV/DIVU/REM/REMU come from picorv32_pcpi_div. No C extension (COMPRESSED_ISA=0), so every instruction is 32 bits. No interrupts (ENABLE_IRQ=0, irq tied to 0), so the PicoRV32 IRQ instructions are not decoded. ecall/ebreak and illegal instructions trap (CATCH_ILLINSN=1). Misaligned CPU loads and stores trap (CATCH_MISALIGN=1).
memory_interface: 'Native PicoRV32 valid/ready bus: 32-bit data, 4 byte strobes, one outstanding transaction, no bursts. CPU and accelerator share one bus through a mux, and mem_rdata is shared by both. In red_soc_tb the SRAM registers mem_ready one cycle after it sees mem_valid&&!mem_ready, so each word costs 2 cycles. RAM is 0x00000000-0x0003FFFF. MMIO: 0x10000000 putchar (write), 0x10000004 exit (write), 0x10000008 cycle counter (read). Any other address hits $fatal. The SRAM ignores address bits [1:0] (index mem_addr>>2).'
microarchitecture: 'Not pipelined: a multi-cycle state machine (fetch -> ld_rs1 -> exec/shift/ldmem/stmem -> fetch). The register file is dual-port, so ld_rs2 is skipped. The only overlap is a prefetch of the next instruction during execute. On this SoC''s registered SRAM, a reg/imm ALU op takes about 4 cycles and a load about 7. The vendor''s zero-wait figures are 3 and 5; each bus beat here adds 1 cycle. Shifts are sequential (BARREL_SHIFTER=0, TWO_STAGE_SHIFT=1): the shifter moves 4 bits per cycle, then 1 bit per cycle. A software MUL costs about 6-7 cycles. DIV costs about 35-40 cycles. Software is slow per instruction, but 32x32 multiply is not slow.'
name: 'PicoRV32 as instantiated in rtl/red_core.v (instance ''cpu''), with red_accel attached over PCPI plus a bus-master port. Parameters: ENABLE_COUNTERS=1, ENABLE_MUL=0, ENABLE_FAST_MUL=1, ENABLE_DIV=1, ENABLE_PCPI=ENABLE_ACCEL (1 in the extended build, 0 in the baseline), ENABLE_IRQ=0, COMPRESSED_ISA=0. All other parameters are the picorv32.v defaults. It runs in rtl/red_soc_tb.v: 256 KiB of 1-wait-state SRAM plus 3 MMIO registers.'
register_file: 32 x 32-bit registers (ENABLE_REGS_16_31=1). x0 reads as 0. 2 read ports and 1 write port (ENABLE_REGS_DUALPORT=1). PCPI receives exactly 2 register operands (rs1, rs2) and can write 1 (rd). No rs3. More operands must come from memory or from state held inside the accelerator.
