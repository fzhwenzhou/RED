    /* crcsick.w -> crcsick_w_model. Four steps of libcrc's CRC-SICK byte
       recurrence (polynomial 0x8005). in[0] = x[rs1] = state: bits 15..0 =
       crc, bits 23..16 = p (previous message byte), bits 31..24 ignored.
       in[1] = x[rs2] = message bytes M0..M3 (Mi = bits 8i+7..8i).
