    /* crcccitt.f8 -> crcccitt_f8_model. MSB-first CRC-16, polynomial 0x1021
       (crc_xmodem, crc_ccitt_1d0f, crc_ccitt_ffff), over 8 message bytes,
       starting from a zero register. in[0] = x[rs1] = message bytes M0..M3
       (Mi = bits 8i+7..8i), in[1] = x[rs2] = message bytes M4..M7.
       out[0] = the 16-bit register in message byte order (bits 7..0 =
       register bits 15..8, bits 15..8 = register bits 7..0), zero-extended;
       out[1] = 0. */

    static uint32_t bswap32(uint32_t x)
    {
        return (x >> 24) | ((x >> 8) & 0x0000FF00u) | ((x << 8) & 0x00FF0000u) | (x << 24);
    }

    /* One step of an MSB-first shift register held in bits 31..16 of r, with
       the message bits still to enter below it: shift left, XOR the
       polynomial if the bit shifted out was 1. Branch-free. */
    #define MSB_STEP(r, p) ((r) = ((r) << 1) ^ ((p) & ((uint32_t)0 - ((r) >> 31))))

    /* 32 steps. Each pass of the loop is one cycle of the reference
       datapath, which advances 8 message bits per cycle. */
    static uint32_t msb_steps32(uint32_t r, uint32_t p)
    {
        for (int i = 0; i < 4; i++) {
            MSB_STEP(r, p); MSB_STEP(r, p); MSB_STEP(r, p); MSB_STEP(r, p);
            MSB_STEP(r, p); MSB_STEP(r, p); MSB_STEP(r, p); MSB_STEP(r, p);
        }
        return r;
    }

    void crcccitt_f8_model(const uint32_t in[2], uint32_t out[2])
    {
        /* M0 enters first, so it is the most significant byte. */
        uint32_t r = msb_steps32(bswap32(in[0]), 0x10210000u);
        uint32_t c;
        r = msb_steps32(r ^ bswap32(in[1]), 0x10210000u);
        c = r >> 16;
        out[0] = (c >> 8) | ((c & 0xFFu) << 8);
        out[1] = 0;
    }
