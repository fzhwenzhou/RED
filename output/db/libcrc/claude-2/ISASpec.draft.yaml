base_isa: rv32im_zicntr (PicoRV32, red_core.v, ENABLE_ACCEL=1)
critic_rounds: 1
csrs: []
description: Eight pure two-register CRC primitives for libcrc on PicoRV32. Seven of them fold 8 message bytes (two lw-loaded words) through one fixed polynomial starting from a zero register. The caller XORs the running CRC into the first word, so the instruction needs no state operand. Results come back in message byte order, so for both reflected and MSB-first CRCs the fold costs one xor. The eighth instruction threads CRC-SICK's (crc, previous-byte) state through rs1 -> rd, four bytes at a time. All eight run on one shared, constant-time shift-register engine inside red_accel (no multiplier, no memory traffic, no architectural state). The loop over the buffer, the start values and the final XOR/byte-swap epilogues stay in C.
