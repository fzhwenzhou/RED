- c_model: |
    #include <stdint.h>
    #include <string.h>

    /* crc32.f8 -> crc32_f8_model. Reflected (LSB-first) CRC-32, polynomial
       0xEDB88320, over 8 message bytes, starting from a zero register.
       in[0] = x[rs1] = message bytes M0..M3 (Mi = bits 8i+7..8i),
       in[1] = x[rs2] = message bytes M4..M7. out[0] -> x[rd]; out[1] = 0. */

    /* One shift-register step: shift right, XOR the polynomial if the bit
       shifted out was 1. Branch-free, so the model runs in constant time. */
    #define REFL_STEP(r, p) ((r) = ((r) >> 1) ^ ((p) & ((uint32_t)0 - ((r) & 1u))))

    /* 32 steps. Each pass of the loop is one cycle of the reference
       datapath, which advances 8 message bits per cycle. */
    static uint32_t refl_steps32(uint32_t r, uint32_t p)
    {
        for (int i = 0; i < 4; i++) {
            REFL_STEP(r, p); REFL_STEP(r, p); REFL_STEP(r, p); REFL_STEP(r, p);
            REFL_STEP(r, p); REFL_STEP(r, p); REFL_STEP(r, p); REFL_STEP(r, p);
        }
        return r;
    }

    void crc32_f8_model(const uint32_t in[2], uint32_t out[2])
    {
        uint32_t r = refl_steps32(in[0], 0xEDB88320u);
        r = refl_steps32(r ^ in[1], 0xEDB88320u);
        out[0] = r;
        out[1] = 0;
    }
