        for (int i = 0; i < 8; i++) {
            MSB64_STEP(r); MSB64_STEP(r); MSB64_STEP(r); MSB64_STEP(r);
            MSB64_STEP(r); MSB64_STEP(r); MSB64_STEP(r); MSB64_STEP(r);
        }
        out[0] = bswap32((uint32_t)(r >> 32));
        out[1] = 0;
    }
