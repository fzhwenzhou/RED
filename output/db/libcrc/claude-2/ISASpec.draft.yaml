    #define MSB64_STEP(r) ((r) = ((r) << 1) ^ (0x42F0E1EBA9EA3693ull & ((uint64_t)0 - ((r) >> 63))))

    void crc64_f8h_model(const uint32_t in[2], uint32_t out[2])
    {
        /* M0 enters first, so it is the most significant byte. */
        uint64_t r = ((uint64_t)bswap32(in[0]) << 32) | (uint64_t)bswap32(in[1]);
