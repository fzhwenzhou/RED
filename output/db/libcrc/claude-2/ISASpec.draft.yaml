rationale: |
  S2a: patterns and Amdahl. The ten mined loops cover 85.5% of the profile. Every
  loop is a byte-serial recurrence that is linear over GF(2). There are four
  shapes:
    (1) reflected, table-driven CRC: crc_32 (0xEDB88320), crc_16 + crc_modbus (0xA001),
        crc_kermit (0x8408), crc_dnp (0xA6BC). 39.4% of cycles.
    (2) MSB-first 16-bit, table-driven: crc_xmodem, crc_ccitt_1d0f, crc_ccitt_ffff,
        all through crc_ccitt_generic (0x1021). 27.0%.
    (3) MSB-first 64-bit, table-driven: crc_64_ecma (0x42F0E1EBA9EA3693). 6.75%.
        The unmined crc_64_we runs the identical loop for another 6.75%.
    (4) CRC-SICK, bit-serial: one shift + conditional 0x8005 per byte, plus a
        byte-pair XOR. 12.4%.
  On this core one table step is lbu + xor + andi + slli + add + lw/lhu +
  srli/slli + xor + loop overhead. That is about 40-60 cycles per byte, because
  there is no barrel shifter and loads cost 5 cycles. CRC-64 is worse: its
  64-bit state needs two-word shifts on RV32. The work the base ISA is bad at is
  the shift/XOR recurrence itself. Seven distinct recurrences carry all ten
  loops. The extension has one instruction per recurrence (two for CRC-64).

  Gate 3 credits each instruction against exactly one mined loop, so the credited
  coverage is 59.6%: crc_sick, crc_ccitt_1d0f, crc_16, crc_kermit, crc_dnp,
  crc_32, crc_64_ecma. The Amdahl ceiling on that is 2.48x. These instructions
  are not credited for crc_modbus (crc16.f8), crc_xmodem and crc_ccitt_ffff
  (crcccitt.f8) or crc_64_we (crc64.f8h/l), but those functions run on them
  unchanged. Only a start value or an epilogue differs, and both stay in C. That
  is another 32.6% of the application. The extension does not add a
  duplicate-semantics opcode for any of them just to collect credit. Only crc_8
  (5.6%, unmined) and the update_crc_* streaming calls (about 1.3%) stay in
  software.

  S2b: why this shape.
  * Register form, not block. All operands fit in two registers, so nothing
    addresses memory. There is no operand traffic, no bus mastering, and busy
    stays 0. This is the Zbkb/Zknh pattern: the instruction does the step the
    base ISA is bad at, and the loop stays in C.
  * 8 bytes per instruction. Two source registers carry at most 64 fresh message
    bits, which is the most work a two-register instruction can be handed. The
    28-cycle-class issue overhead is therefore amortised over 8 bytes, against
    the roughly 320-480 cycles the table loop spends on them.
  * No state operand. A CRC whose register is at most 64 bits wide is fully
    consumed by 8 message bytes. Running it from state S over M0..M7 equals
    running it from zero over M0..M7 with S XORed into the first bytes. So the
    caller folds the running CRC into the first word(s) with one xor. The
    instruction stays pure, needs no CRC register file, CSR or context-switch
    story, and can be tested alone.
  * Results in message byte order. For MSB-first CRCs the register's top byte
    meets the next message byte. A natural-order result would force a byte swap
    in software for every chunk. RV32IM has no rev8, so that would be about 10
    instructions with 8-24-bit shifts at 4-9 cycles each. crcccitt.f8 and
    crc64.f8h/l return the register byte-reversed, which is free wiring in
    hardware. The software state is then directly XOR-able into the next lw.
    The one byte swap happens once per call, in the epilogue.
  * One opcode per polynomial, not a polynomial operand. rs2 is needed for data,
    and a polynomial CSR would add architectural state. The fixed polynomials are
    a 7-entry constant ROM in front of one shared engine.
  * CRC-64 as a pair (crc64.f8h, crc64.f8l). One rd cannot hold a 64-bit result.
    Each half recomputes the full 64-step pass from the same two inputs, so the
    pair costs two engine passes. Latching the low half in a hidden register
    would save one pass, but it adds undeclared state between instructions, so
    it was rejected.
  * CRC-SICK is not a byte-aligned CRC. The register shifts only one bit per
    byte, so a byte never consumes the state, and the fold does not apply. The
    24-bit state (crc plus previous byte) therefore threads through rs1 -> rd, and
    rs2 carries four message bytes.

  Reference datapath, informative. One shift-register engine in red_accel has a
  64-bit register, a 64-bit message shifter and 8 unrolled steps. Each step is a
  shift plus an AND-XOR with the selected polynomial. Width, direction and
  polynomial are selected by funct3/funct7, and reflected/MSB-first conversion is
  input/output bit and byte wiring. The engine advances 8 message bits per cycle:
  8 cycles for a .f8 instruction, and 1 cycle for crcsick.w (four 1-bit steps).
  The cost is about 140 flops plus about 8x64 AND/XOR. It has no multiplier, so
  fast_mul is not duplicated, and no buffers. Every instruction has a fixed
  latency independent of operand values. The unit asserts pcpi_wait on accept,
  raises pcpi_ready+pcpi_wr with the result, then waits for pcpi_valid to drop
  (S_WAIT). It never asserts busy, so the bus mux stays on the CPU. The C models
  are written with one loop pass per engine cycle.

  Software use per aligned 8-byte chunk: lw, lw, xor (two for CRC-64), the
  instruction (or the f8h/f8l pair), addi, bne. That is about 25 base cycles
  plus the instruction. Head and tail: lw needs 4-byte alignment, because
  misaligned loads trap with CATCH_MISALIGN=1. The caller therefore runs the
  existing table loop on the first (-p)&3 bytes and on the trailing bytes that
  do not fill a chunk. For the profiled 16384-byte static buffer that is 0 bytes
  of each. marshal_words is 0 for every instruction because the operands are the
  application's own words, loaded in place.

  S2c: critic rounds.
  * Ambiguity: byte order (Mi = bits 8i+7..8i of its register), bit order within
    a byte (LSB-first for reflected, MSB-first otherwise) and output byte order
    are all stated in the pseudocode. Upper output bits are defined as 0.
  * Totality: every input is legal. Bits 31..24 of crcsick.w's rs1 are ignored.
    Nothing traps.
  * Collisions: all eight sit in custom-1 (0101011) with distinct
    (funct3, funct7) pairs. custom-0 is avoided, although it is free in this
    build (ENABLE_IRQ=0): earlier reviews objected to it because of PicoRV32's
    IRQ ops, and red_accel decodes the opcode itself, so custom-1 reaches it
    unchanged. Nothing is in OP/funct7=0000001, so there is no clash with
    fast_mul or div in the PCPI result mux.
  * Unassigned custom-1 encodings get no answer from red_accel, so they time out
    and trap as illegal instructions. The baseline build (ENABLE_ACCEL=0) traps
    on all of them, so the baseline binary uses only the table code.
register_files: []
state_note: 'No architectural state. Every instruction is a pure function of x[rs1] and x[rs2] that writes only x[rd], so there is nothing to save across a context switch or trap. The running CRC lives in an ordinary integer register owned by the caller. No instruction accesses memory, raises an exception or depends on any CSR. rd may equal rs1 or rs2, because both sources are read before rd is written, and rd = x0 discards the result. Latency is fixed per instruction and independent of operand values. red_accel decodes pcpi_insn[6:0] = 0101011 with the exact funct3/funct7 listed and ignores the rd/rs fields for decode. It stays silent on every other encoding: the unassigned custom-1 points, custom-0, and OP/funct7=0000001 (MUL/DIV). It never asserts busy. This decode replaces the micro-ecc custom-0 decode in the current rtl/red_accel.v.'
