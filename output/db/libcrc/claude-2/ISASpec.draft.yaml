    void crcsick_w_model(const uint32_t in[2], uint32_t out[2])
    {
        uint32_t r = in[0] & 0xFFFFu;
        uint32_t p = (in[0] >> 16) & 0xFFu;
        for (int i = 0; i < 4; i++) {
            uint32_t b = (in[1] >> (8 * i)) & 0xFFu;
            uint32_t m = (uint32_t)0 - (r >> 15);   /* all-ones iff bit 15 set */
