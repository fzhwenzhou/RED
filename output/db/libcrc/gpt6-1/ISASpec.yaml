rationale: |-
  S2a: both mined loops are loop-carried linear polynomial CRC recurrences with serial table lookups, shifts, XORs and sequential byte loads. CRC-32 alone has Amdahl cap 1/(1-0.5383541965514747)=2.166x; CRC-64 alone caps at 1.857x; together coverage is 0.9998107087713004 and the ideal cap is about 5282.86x (a coverage ceiling, not a forecast). Profile counts are host instruction proxies, not measured target cycles. S2b: a 64-bit message fold matches the two 32-bit PCPI input ports. A 32-bit CRC result needs one instruction; a 64-bit result needs two because PCPI has one 32-bit rd. This preserves software's buffer walk, load/store architecture and scalar state, and requires no architectural file/CSR. It retains the legal reg words=2 shape and eight-byte granularity of the converged 20261025-231142-7ab4f6 crc32.d/crc64.dh/crc64.dl design, with current-workload invocation counts and explicit double computation cost. Earlier 17/18-word block CRC winners are rejected as a starting ABI because block compute violates this run's load/store rule, and their artificial nonzero mac_ops do not describe CRC arithmetic. No CRC-16 or other unmined kernel is targeted.
  Cost: read_core reports PCPI acceptance overhead 1 clock, ordinary ALU 4 cycles, loads 7, word transfers 2; this acceptance clock excludes fetch/decode/writeback. Keep that separate from the supplied gate's conservative 28-cycle complete instruction allowance. Each custom invocation has 0 memory beats, 0 integer multiplies, and 64 polynomial bit transitions; NEVER price it as just 28 cycles or charge one transform for the CRC-64 pair. A feasible compact implementation is 64 fixed one-bit cycles using a shared 64-bit shift/XOR work register; a fixed 8-bit unroll would be an optional RTL optimization, not assumed here. Budget 28+64=92 clocks per instruction, 184 for the CRC-64 pair. Budget ordinary caller work separately: 48 clocks per eight bytes for CRC-32 and 52 for CRC-64, covering two aligned loads (14), 1/2 XORs (4/8), pointer/count/control and slack. Thus each 16384-byte CRC-32 call budgets 2048*(92+48)=286720 cycles, each CRC-64 call 2048*(184+52)=483328 cycles; no overlap while PCPI stalls the core. The current functions cost 114696 and 98313 host instructions per call, or 974916 and 835660.5 target cycles at the supplied 8.5 calibration. Combined budget including the measured uncovered host work yields approximately 2.35x, before RTL measurement; count both halves against one CRC-64 baseline and count coverage once. This is an estimate, not a Gate-3 or RTL pass.
  Hardware feasibility: custom-1 funct3=000 with funct7=0000001/0000010/0000011 gives matches 0x0200002B/0x0400002B/0x0600002B under mask 0xFE00707F. It cannot overlap standard M, existing red_accel custom-0 or PicoRV32 IRQ custom-0. Decode only these exact triples; assert pcpi_wait promptly on recognized valid and keep it high through fixed work to prevent the four-bit unsupported-instruction timeout. Complete with pcpi_ready and pcpi_wr, one pcpi_rd, then retire; ignore unrelated encodings. No new integer multiplier/divider, general barrel shifter, lookup RAM or tile buffer is justified. Shifts by one and byte reversal are fixed wiring plus polynomial XOR taps; a shared CRC engine can reuse red_accel's existing 64-bit work storage and staged operand storage while it is idle, with only mode/count control. All operand/work bits are overwritten on every issue and are unobservable afterward. The engine may be dedicated instead if RTL sharing timing warrants; area needs synthesis, not storage-count claims. Register CRC operations never assert the accelerator memory request or take memory-bus ownership; retain the existing memory master, busy mux and mem_issued guarding for legacy block operations. CPU instruction fetch remains governed by the existing native interface.
  S2c review scope: verify total unsigned recurrences and byte ordering against the source tables, complete output initialization and exactly sized arrays under sanitizers, constant input-independent instruction counts, paired CRC-64 composition across complete buffers, and unique custom decode. No hidden state is permitted to cache the unreturned CRC-64 half. Instructions remain callable individually, including with zero or identical registers.
  S2c completed in three passes: (1) shape/cost audit selected only pure reg forms, corrected old 508/64-byte invocation assumptions to 2048 per current 16-KiB call, reserved custom-1 encodings, and explicitly charged both CRC-64 halves; (2) semantics/model audit compiled all models as C99 with GCC -O2 -Wall -Wextra -Werror -pedantic and AddressSanitizer/UndefinedBehaviorSanitizer, checked 100000 vectors per instruction against the actual libcrc byte-update/table code, two distinct output poisons, preserved inputs, in-place arrays, and arbitrary starting-CRC composition, plus 1044 full-buffer cases at offsets 0..3 and lengths 0..257, 4095, 4096, 16384 and null-input/text checks, all passing; (3) security/encoding audit measured identical Callgrind Ir for 1000 calls per model on eight operand patterns (331000 for xcrc32.d, 266000 for xcrc64.dh, 267000 for xcrc64.dl in every pattern) and exhaustively checked all 98304 register-field encodings for distinct decoding. Both reference arrays are exactly two allocated uint32_t words in sanitizer vector tests. These are local designer checks, not a claim that the independent Spike differential Gate 2 or performance/security gates have already run.
register_files: []
state_note: 'No additional architectural state. The running CRC lives in normal GPRs and is saved/restored by the base ABI. No custom CSR or context-save protocol is needed. Temporary PCPI computation storage is not persistent architectural state: it is initialized entirely from current operands, cannot be read by later instructions, and reset abandons it. The in-order core is stalled throughout each bounded operation; IRQs are disabled on this target. Future trap/IRQ support must retire or cancel an in-flight operation before a context switch; no partially written rd is visible. Every computation is total; custom-1 decoding has no memory or privilege side effects.'
tests:
- 'link1: coverage 99.98% >= 80%; 3/3 C models built and survived 100,000 vectors under ASan+UBSan'
- 'gate2: 3/3 instructions: C model and patched Spike agree on 100,000 random + corner vectors'
