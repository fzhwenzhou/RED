description: 'Three stateless register CRC folding primitives for the current libcrc workload on RED''s PicoRV32. xcrc32.d folds eight bytes for the reflected 0xEDB88320 recurrence. xcrc64.dh and xcrc64.dl return complementary halves of the non-reflected 0x42F0E1EBA9EA3693 eight-byte transform in fold-ready byte order; both are required per eight bytes. All forms are reg, words=2, two input GPRs and exactly one output GPR, no memory operand blocks. Source truth: HotLoopReport loops crc_32::byte_update (share 0.5383541965514747, 939589632 profiled instructions, 8192 calls) and crc_64_ecma::byte_update (share 0.4614565122198257, 805380096 profiled instructions, 8192 calls); libcrc/src/crc32.c, libcrc/src/crc64.c, libcrc/include/checksum.h and precalc/crc32_table.c / crc64_table.c establish the recurrences, polynomials and initialization/finalization. The current profile/run1/_red_workload.c has BUFFER_SIZE=16384 and calls each CRC 8192 times. Its buffer symbol is at 0x20020 in the inspected harness, hence word aligned. One instruction (or, for CRC-64, one pair) consumes eight data bytes: 16384/8=2048 invocations PER FUNCTION CALL for EACH applicable mnemonic, not 8192 total calls and not the prior run''s 508. marshal_words=0 because there is no memory operand/output block and no copy or scatter; two ordinary source-word loads and XOR/loop work remain in software and are priced separately. The current report leaves trip_count unknown; direct inspection of /home/naonao/RED/output/work/libcrc/20261026-022303-943b21/profile/run1/_red_workload.c supplies the missing data volume. No spike_model is supplied.'
