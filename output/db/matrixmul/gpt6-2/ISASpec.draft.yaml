  name: Four signed-byte dot product
  opcode: custom-1
  operands:
  - rd
  - rs1
  - rs2
  pseudocode: |-
    Define S8(b) = integer(b XOR 128) - 128, for b in 0..255.
    a := in[0]
    b := in[1]
    sum_0 := 0
    For i in the fixed range 0..3:
      a_i := S8((a >> (8*i)) AND 255)
      b_i := S8((b >> (8*i)) AND 255)
      p_i := a_i * b_i (exact signed 32-bit multiplication)
      sum_(i+1) := sum_i + p_i (exact; every prefix fits int32)
    r := sum_4 modulo 2^32
    out[0] := r
    out[1] := 0
    x[rd] := r (discard when rd=0)
