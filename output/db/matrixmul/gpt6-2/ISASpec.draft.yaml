  - rs2
  pseudocode: |-
    All arithmetic below is unsigned 32-bit modulo 2^32 except boolean comparisons; BOOL produces 0 or 1. SEL(c,a,b)=(a AND (0-BOOL(c))) OR (b AND NOT(0-BOOL(c))). All shifts have counts 0..31; every expression is evaluated.
    For each i in the fixed range 0..1, independently:
      u_i := in[i]
      s_i := u_i >> 31
      e_i := (u_i >> 23) AND 255
      f_i := u_i AND 0x007fffff
      m_i := f_i OR 0x00800000
      d_i := (144 - e_i) AND 31
      q_i := m_i >> d_i
      t_i := m_i AND ((1 << d_i) - 1)
      n_i := BOOL(e_i >= 121) AND BOOL(e_i <= 128) AND BOOL(t_i = 0) AND BOOL(q_i <= 127+s_i)
      z_i := BOOL((u_i AND 0x7fffffff) = 0)
      b_i := SEL(n_i, ((q_i XOR (0-s_i)) + s_i) AND 255, 0)
      bad_i := 1 XOR (n_i OR z_i)
    r := b_0 OR (b_1 << 8) OR ((bad_0 OR bad_1) << 31)
    out[0] := r
    out[1] := 0
    x[rd] := r (discard when rd=0)
  reads_state: []
  replaces: multiply::matrix_product_loop_nest
  semantics: Register operands are values, never addresses. in[0]=x[rs1] and in[1]=x[rs2]; out[0] is the sole result written to x[rd], while out[1]=0 is model padding only. Read all sources before writeback; rd may equal a source and x0 discards writeback. No memory access, alignment condition, arithmetic trap, CSR access, floating-point exception flags, or persistent state. All input bit patterns are defined. Each instruction has operand-independent latency and fixed work; invalid arithmetic data is handled by the specified result, without early completion. The two-word model arrays do not cause bus transfers or a second architectural result. Interpret each source as an IEEE binary32 bit pattern. Accept a lane exactly when its numerical value is q/64 for an integer q in [-128,127]. Both signed zeros are accepted as q=0. Return rs1's q modulo 256 in bits 7:0 and rs2's in bits 15:8. A rejected lane contributes byte zero. Bit 31 is one if either lane is rejected; bits 30:16 are zero. Reject all NaNs, infinities, nonzero subnormals, out-of-range values and values between grid points. This is checked exact conversion, with neither saturation nor rounding. For example -2 is accepted as 0x80; +2 is rejected. Test bit 31 before combining pairs into four-byte words. Software performs layout conversion and handles rejection by retaining the original float kernel. One logical 10x10 product packs 200 elements with 100 invocations. invocations=20000000 accounts for all 200000 logical products in the frozen report's single aggregate call; see rationale. marshal_words=0 because there is no block ABI; ordinary CPU loads, pair combining, and scratch stores are separately required caller work.
