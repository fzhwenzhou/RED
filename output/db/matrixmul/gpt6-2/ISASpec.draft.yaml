rationale: |-
  S2a: The sole mined region is multiply::matrix_product_loop_nest, a row-major float matrix product with strided B reads and a loop-carried C accumulation. Its frozen cycle share is 0.9957060242855349, so accelerating this region alone has an ideal Amdahl ceiling of about 232.8844x. That is an upper bound, not a prediction; loop control, initialization, loads/stores, conversion, checking and software fallback remain. There are no other mined regions to credit.

  Evidence refining the report's explicitly unknown geometry: read_profile names the generated source output/work/matrixmul/20261026-125631-fe3ed0/profile/run1/_red_workload.c, which was found and read directly. It declares BANK=16, DIM=10, ITERATIONS=200000. Initial A values are ((n*13+i*7+j*3)%33-16)/16; B values are ((n*11+i*5+j*17)%31-15)/16. Each iteration changes one A value to ((iteration*19+n*7)%65-32)/32, and calls the project's multiply through a volatile function pointer. All these values are exactly on the Q6 grid within the checked byte range. This is evidence for a checked exact specialization, not permission to quantize arbitrary float data. The supplied test.c's 2x2 example does not determine these counts.

  Invocation accounting: each logical multiply processes 100 A and 100 B float elements and computes 100 length-10 dot products: packing=(100+100)/2=100, dots=100*ceil(10/4)=300, output conversions=100. The report has calls=1 and dynamic_cycles=1884810512 for the aggregate profiling region. Raw callgrind.out identifies multiply and multiply'2, with a self-edge calls=199998; its function attribution is collapsed and its one reported call is not one logical 10x10 product. The generated harness supplies the exact 200000 logical products. Therefore the fields use 200000*[100,300,100]=[20000000,60000000,20000000] per frozen reported call, preserving its measurement scale. They are NOT counts for one source-level call: those are [100,300,100]. If A1 repairs calls to 200000, divide these fields by 200000 together; do not alter either side independently. The frozen report is unchanged. Its host-instruction attribution also includes non-kernel work, so whole-region credit is an optimistic bound.

  S2b: Start from the converged xqpack2.s/xqdot4/xqto.s family, retaining its words=[2,2,2], mac_ops=[0,4,0] and Q6 scale, and recount invocations for this harness. It fits the two-source/one-result PCPI interface and all current shape/security bounds. Earlier memory-to-memory MACs and 200/240-word tile kernels violate today's bounds; floating scalar multiply/add would support general floats but would pay two issues per term and require a complete binary32 arithmetic datapath. This family adds checked packing and normalization logic and reuses red_accel's existing multiplier/accumulator across four steps. No additional multiplier, divider, floating-point ALU, wide architectural buffer, CSR, or register file is required. Do not use the CPU internal fast_mul concurrently with external PCPI completion.

  Software schedule and exactness: fast-path only valid nonoverlapping C versus A/B Matrix storage, binary32 float layout, round-to-nearest ties-to-even evaluation, and dimensions 10x10; retain the original function for all other cases. A and B may overlap each other, since both are only read. Keep the original dimension check/return behavior. Check output/input overlap before copying or clearing; on overlap run the original, so its clearMatrix and alias semantics survive. Pack every input once each call, accumulate all rejection bits without early exit, and invoke the original function if any bit is set. Never cache packed operands across calls: the harness mutates A. Use ordinary CPU loads/stores to build ten A rows and ten B columns, each three packed words; merge two low-16-bit pair results with OR and shift-by-16, and explicitly zero the upper two lanes of the final word. This requires 60 caller-owned scratch words (240 bytes); it is ordinary software memory, not hidden accelerator state. CPU loads two words for each xqdot4, combines three results with two ADDs, converts via xqto.s and stores C. Preserve clearMatrix's initialization of all 100 C elements and result dimensions. Do not move memory access into compute instructions. Any optional output-buffer overlap with software scratch is prohibited by allocation.

  An accepted value is q/64, |q|<=128. Each product is an exact integer/4096 of magnitude <=16384/4096. Every prefix of a length-10 dot has numerator magnitude <=163840, far below 2^24, so every source binary32 multiplication and subsequent addition is exact. Regrouping into three integer dot results thus preserves source results. Both signed-zero inputs map to zero; the source starts C at +0, and RNE accumulation yields +0 for an exactly zero final sum, matching xqto.s. No approximation, saturation, double rounding or unguarded treatment of float encodings as integers is used. NaNs, infinities, subnormals and off-grid values always trigger fallback.

  Cost: read_core reports acceptance overhead 1 cycle, ALU 4, CPU load 7, accelerator word throughput 2, and existing multiplier/accumulator. The RED calibrated end-to-end issue model is 28 cycles (the acceptance cycle plus 27 implementation cycles), not 1; neither figure includes arbitrary conversion latency. With zero accelerator beats, the simple lower-bound instruction costs are 28,32,28, totaling 15200 cycles per logical product before model-measured sequential conversion work. Baseline aggregate/200000 is 9424.05256 host instructions, about 80198.6873 calibrated target cycles. Pricing only custom issues would give an optimistic roughly 5.18x application speedup; do not claim this as achieved. Retain CPU work: at least 200 input loads, 60 scratch stores, 600 packed-word loads, 100 result stores, 100 initialization stores, pair merges, rejection handling, address/index/loop work, and 200 partial-sum ADDs. At the core's 7-cycle memory cost these 1060 memory accesses alone add 7420 cycles; extra logic, loop instructions and real PCPI latency must also be charged. marshal_words=0 truthfully means no instruction-block copying; it does not make this software traffic free. Gate 3 must sum the three instruction costs against the region only once, and any measured speedup needs an integrated RV32 implementation.

  S2c: Three critique passes cover (1) shape/encoding/resource and report-count consistency, (2) numeric totality and exact fast-path/fallback equivalence, and (3) constant-work models, output padding, memory bounds, observability and register aliasing. All instructions are pure reg forms; all three output functions are directly observable and no state sequencing assumption is needed. Gate 2 remains independent: no Spike model is supplied, and local reference checks do not assert a Gate-2 pass.
register_files: []
state_note: No added architectural state. Only x[rd] changes; x0 discards. Context switches use the existing integer-register context and need no extension save area. No fcsr/fflags or floating register file exists or is touched. Every input terminates after an operand-independent schedule. Assert pcpi_wait at recognition/acceptance before the 4-bit no-wait timeout, keep it asserted until the fixed completion cycle, then assert ready/wr and the defined rd. Wait for pcpi_valid to drop before accepting the same request again. For these register operations mem_valid and mem_wstrb stay zero throughout; in[]/out[] are test interfaces only. The existing accelerator busy signal may still stall CPU memory acknowledgments while the shared datapath is occupied. The reserved custom-0 operation remains separately decoded, with its mem_issued/beat_done request qualification unchanged. Reset cancels transient work without stale writeback; no transient arithmetic buffer is state shared between invocations. A future RTL implementation must verify equal acceptance-to-ready latency across operand classes; model tests alone do not prove that.
tests:
- 'Local C99 models: each passed RED ASan+UBSan battery on 100000 vectors, including input immutability, full output overwrite and repeatability checks.'
- 'Independent arithmetic oracle: 100000 random operand pairs per operation, all 256 accepted Q6 grid values and adjacent encodings, all exponent classes/signs, signed zeros, NaNs, infinities, subnormals, conversion ties and INT32 limits passed.'
- Composed model schedule matched the original multiply function bit-for-bit for all 200000 products of the generated harness, plus 1000 full-range random Q6 matrices; NaN and off-grid inputs rejected the specialized path.
- 'RED callgrind constant-work checks: six operand vectors each; counts xqpack2.s=73, xqdot4=39, xqto.s=63 on every vector. These are host reference-model instruction counts, not PCPI cycle latencies.'
- Local RED schema, structural rules, custom encoding checks, model text checks and static operand-taint scan found no findings. The final pack model contains all work directly so profiling includes both lanes.
- 'Dynamic secret-branch testing remains unverified: normal memcheck could not start because of host loader redirection; static libc reported unrelated runtime errors, and a no-libc isolated attempt faulted under memcheck. No pass is claimed for this check. Source inspection and callgrind counts establish fixed control flow for tested builds but are not RTL timing evidence.'
- Independent Spike Gate 2 and hardware timing/area/performance verification are deferred to their pipeline stages; no Spike implementation or formal gate pass flags are supplied.
