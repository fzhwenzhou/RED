- c_model: |
    #include <stdint.h>

    void xqdot4_model(const uint32_t in[2], uint32_t out[2])
    {
        uint32_t a = in[0];
        uint32_t b = in[1];
        int32_t sum = 0;
        for (uint32_t i = 0; i < 4u; ++i) {
            uint32_t au = (a >> (8u * i)) & 255u;
            uint32_t bu = (b >> (8u * i)) & 255u;
            int32_t av = (int32_t)(au ^ 128u) - 128;
            int32_t bv = (int32_t)(bu ^ 128u) - 128;
            sum += av * bv;
        }
        out[0] = (uint32_t)sum;
        out[1] = 0u;
    }
