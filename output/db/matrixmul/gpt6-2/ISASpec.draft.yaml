- c_model: |
    #include <stdint.h>

    void xqpack2_s_model(const uint32_t in[2], uint32_t out[2])
    {
        uint32_t lanes = 0u;
        uint32_t rejected = 0u;
        for (uint32_t i = 0u; i < 2u; ++i) {
        uint32_t u = in[i];
        uint32_t sign = u >> 31;
        uint32_t exponent = (u >> 23) & 255u;
        uint32_t significand = (u & 0x007fffffu) | 0x00800000u;
        uint32_t shift = (144u - exponent) & 31u;
        uint32_t magnitude = significand >> shift;
        uint32_t tail = significand & ((1u << shift) - 1u);
        uint32_t normal_ok = (uint32_t)(exponent >= 121u)
                           & (uint32_t)(exponent <= 128u)
                           & (uint32_t)(tail == 0u)
                           & (uint32_t)(magnitude <= 127u + sign);
        uint32_t zero_ok = (uint32_t)((u & 0x7fffffffu) == 0u);
        uint32_t negative_mask = 0u - sign;
        uint32_t signed_byte = ((magnitude ^ negative_mask) + sign) & 255u;
        uint32_t lane = signed_byte & (0u - normal_ok);
        uint32_t reject = 1u ^ (normal_ok | zero_ok);
        lanes |= lane << (8u * i);
        rejected |= reject;
        }
        out[0] = lanes | (rejected << 31);
        out[1] = 0u;
    }
