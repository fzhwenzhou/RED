  name: Signed integer scaled by 2^-12 to binary32
  opcode: custom-1
  operands:
  - rd
  - rs1
  pseudocode: |-
    All expressions are unsigned 32-bit modulo 2^32 unless stated. BOOL produces 0 or 1. SEL(c,a,b)=(a AND (0-BOOL(c))) OR (b AND NOT(0-BOOL(c))).
    u := in[0]
    s := u >> 31
    m := (u XOR (0-s)) + s
    d16 := BOOL(m >= 65536) << 4
    v16 := m >> d16
    d8 := BOOL(v16 >= 256) << 3
    v8 := v16 >> d8
    d4 := BOOL(v8 >= 16) << 2
    v4 := v8 >> d4
    d2 := BOOL(v4 >= 4) << 1
    v2 := v4 >> d2
    d1 := BOOL(v2 >= 2)
    h := d16+d8+d4+d2+d1 (floor(log2(m)) for nonzero m, 0 for m=0)
    w := BOOL(h > 23)
    rshift := (h-23) AND (0-w) (0..8)
    lshift := (23-h) AND 31
    hi := m >> rshift
    lo := m << lshift
    sig := SEL(w,hi,lo)
    rem := m AND ((1 << rshift)-1)
    half := (1 << rshift) >> 1
    inc := BOOL(rshift != 0) AND (BOOL(rem > half) OR (BOOL(rem = half) AND (sig AND 1)))
    rounded := sig+inc
    carry := rounded >> 24 (0 or 1)
    exponent := h+115+carry
    fraction := (rounded >> carry) AND 0x007fffff
    candidate := (s << 31) OR (exponent << 23) OR fraction
    result := SEL(m != 0,candidate,0)
    out[0] := result
    out[1] := 0
    x[rd] := result (discard when rd=0)
  reads_state: []
  replaces: multiply::matrix_product_loop_nest
  semantics: Register operands are values, never addresses. in[0]=x[rs1]; the register-form adapter supplies in[1]=0 for this unary operation; out[0] is the sole result written to x[rd], while out[1]=0 is model padding only. Read all sources before writeback; rd may equal a source and x0 discards writeback. No memory access, alignment condition, arithmetic trap, CSR access, floating-point exception flags, or persistent state. All input bit patterns are defined. Each instruction has operand-independent latency and fixed work; invalid arithmetic data is handled by the specified result, without early completion. The two-word model arrays do not cause bus transfers or a second architectural result. The encoded rs2 field is ignored for all 32 register indices; assemblers conventionally emit rs2=x0. The model ignores in[1] for every bit pattern, not just zero. Interpret x[rs1] as a signed two's-complement integer n. Return the IEEE binary32 encoding of n/4096, with fixed round-to-nearest, ties-to-even, independently of any host or architectural rounding mode. Zero becomes +0. Every nonzero input produces a finite normal result; INT32_MIN yields -524288 (0xc9000000). No inexact flag is accrued. General large integers may round; accepted 10-element Q6 matrix dot products are exact. A logical 10x10 product converts each of 100 integer output sums once, hence invocations=20000000 for the frozen aggregate report call. marshal_words=0; the result is a register word which software stores into C.
