- c_model: |
    #include <stdint.h>

    void xqto_s_model(const uint32_t in[2], uint32_t out[2])
    {
        uint32_t bits = in[0];
        uint32_t sign = bits >> 31;
        uint32_t magnitude = (bits ^ (0u - sign)) + sign;
        uint32_t s16 = (uint32_t)(magnitude >= 0x10000u) << 4;
        uint32_t v16 = magnitude >> s16;
        uint32_t s8 = (uint32_t)(v16 >= 0x100u) << 3;
        uint32_t v8 = v16 >> s8;
        uint32_t s4 = (uint32_t)(v8 >= 0x10u) << 2;
        uint32_t v4 = v8 >> s4;
        uint32_t s2 = (uint32_t)(v4 >= 4u) << 1;
        uint32_t v2 = v4 >> s2;
        uint32_t s1 = (uint32_t)(v2 >= 2u);
        uint32_t high = s16 + s8 + s4 + s2 + s1;
        uint32_t wide = (uint32_t)(high > 23u);
        uint32_t right = (high - 23u) & (0u - wide);
        uint32_t left = (23u - high) & 31u;
        uint32_t large = magnitude >> right;
        uint32_t small = magnitude << left;
        uint32_t sig = (large & (0u - wide)) | (small & ~(0u - wide));
        uint32_t remainder = magnitude & ((1u << right) - 1u);
        uint32_t halfway = (1u << right) >> 1;
        uint32_t increment = (uint32_t)(right != 0u)
                           & ((uint32_t)(remainder > halfway)
                           | ((uint32_t)(remainder == halfway) & (sig & 1u)));
        uint32_t rounded = sig + increment;
        uint32_t carry = rounded >> 24;
        uint32_t exponent = high + 115u + carry;
        uint32_t fraction = (rounded >> carry) & 0x007fffffu;
        uint32_t result = (sign << 31) | (exponent << 23) | fraction;
        out[0] = result & (0u - (uint32_t)(magnitude != 0u));
        out[1] = 0u;
    }
