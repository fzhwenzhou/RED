    - Triple-nested loop; trip count = C.rows * C.columns * A.columns, set by runtime matrix dims (up to 100 elements per matrix, MAX_ELEMENTS=100); the shipped test.c uses 2x2 but the profile harness calls multiply 40000 times.
    - 'Inner body is a multiply-accumulate on 32-bit IEEE float: C[i][j] += A[i][k] * B[k][j] (one fmul + one fadd, no fma).'
    - Loop indices i,j,k are int starting at 1; row/column fields are unsigned char (8-bit) and are zero-extended before the index arithmetic.
    - 'Address pattern: getElement/setElement compute elements[(row-1)*columns + (col-1)] with columns loaded from the struct each time; this is a multiply plus adds per access, 4 bytes per element, 3 element loads and 1 store per iteration.'
