  pseudocode: |
    // canon(v): select, not a branch
    canon(v)      = ((v & 0x7FFFFFFF) > 0x7F800000) ? 0x7FC00000 : v
    // IEEE 754 binary32, roundTiesToEven, gradual underflow, no flags
