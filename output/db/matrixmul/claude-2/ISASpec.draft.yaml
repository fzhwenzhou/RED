base_isa: rv32im + Zicntr (PicoRV32, COMPRESSED_ISA=0, ENABLE_IRQ=0, no F extension)
critic_rounds: 2
csrs: []
description: |
  Two R-type register-to-register instructions in custom-1 plus one 32-bit
  architectural accumulator register (FACC). Together they implement the
  binary32 dot product sum_k A[i][k]*B[k][j] that is the body of
  multiply::ijk_matmul, with exactly the rounding of the application's C code:
  each product is rounded to binary32 (round-to-nearest-even), then added to the
  running sum and rounded again (NOT a fused multiply-add). On this RV32IM core
  there is no F extension, so each of those two operations is otherwise a
  libgcc soft-float call. The loop nest, the address arithmetic and the loads of
  A and B stay in software. Neither instruction touches memory.
encodings: []
gate2_vectors: 0
instructions:
- c_model: |
    #include <stdint.h>

    /* FACC: the extension's single 32-bit architectural accumulator, holding
       a binary32 value. Reset value 0x00000000 (+0.0). File-scope state; this
       instruction returns only the product, so its output is a pure function
       of in[]. */
    static uint32_t xf_facc = 0u;

    typedef union { uint32_t u; float f; } xf_word;

    /* xfmac.s rd, rs1, rs2: in[0] = x[rs1], in[1] = x[rs2], out[0] -> x[rd].
       p = RNE(x[rs1] * x[rs2]); FACC = RNE(FACC + p); x[rd] = p.
       Any NaN result becomes 0x7FC00000 (branch-free select). */
    void xfmac_s_model(const uint32_t in[2], uint32_t out[2])
    {
        xf_word a, b, p, c, s;
        uint32_t pm, sm;
        a.u = in[0];
        b.u = in[1];
        p.f = a.f * b.f;
        pm = (uint32_t)0 - (uint32_t)((p.u & 0x7FFFFFFFu) > 0x7F800000u);
        p.u = (p.u & ~pm) | (0x7FC00000u & pm);
        c.u = xf_facc;
        s.f = c.f + p.f;
        sm = (uint32_t)0 - (uint32_t)((s.u & 0x7FFFFFFFu) > 0x7F800000u);
        s.u = (s.u & ~sm) | (0x7FC00000u & sm);
        xf_facc = s.u;
        out[0] = p.u;
        out[1] = 0u;
    }
  encoding: 0000100 rs2 rs1 000 rd 0101011
  form: reg
  funct3: '000'
  funct7: '0000100'
  group: compute
  imm_bits: 0
  invocations: 682
  mac_ops: 1
  marshal_words: 0
  mnemonic: xfmac.s
  name: binary32 multiply-accumulate into FACC
  opcode: custom-1
  operands:
  - rd
  - rs1
  - rs2
  pseudocode: |
    // canon(v): select, not a branch
    canon(v)      = ((v & 0x7FFFFFFF) > 0x7F800000) ? 0x7FC00000 : v
    // IEEE 754 binary32, roundTiesToEven, gradual underflow, no flags
    fmul32(a, b)  = canon(binary32_mul_rne(a, b))
    // IEEE 754 binary32, roundTiesToEven, gradual underflow, no flags
    fadd32(a, b)  = canon(binary32_add_rne(a, b))

    a      = X[rs1]
    b      = X[rs2]
    // product rounded to binary32 first
    p      = fmul32(a, b)
    // then added and rounded again (unfused)
    s      = fadd32(FACC, p)
    FACC'  = s
    // no write when rd = x0
    X[rd]' = p
  reads_state:
  - facc
  replaces: multiply::ijk_matmul
  semantics: |
    xfmac.s rd, rs1, rs2 treats x[rs1] and x[rs2] as IEEE 754 binary32 bit
    patterns. It computes p = their product rounded to binary32, adds p into
    the accumulator (FACC <- FACC + p, rounded to binary32) and writes p to
    x[rd].

    Operand packing (register form): in[0] = x[rs1], in[1] = x[rs2], and
    out[0] -> x[rd]. out[1] is not architectural and the model writes it 0.
    Reading x0 gives 0x00000000 (+0.0). If rd = x0 the product is discarded
    but FACC is still updated, which is how the kernel normally issues it.
    Both sources are read before rd is written.

    Arithmetic, for both steps:
    - IEEE 754-2008 binary32 multiplication, then a separate binary32
      addition. Each is rounded with roundTiesToEven. This is NOT a fused
      multiply-add: the product is rounded to binary32 before the addition,
      exactly as the C expression c + a*b does with float operands.
    - Subnormal inputs and outputs are fully supported (gradual underflow,
      no flush-to-zero, no denormals-are-zero).
    - Overflow gives +/-Infinity.
    - The sign of a product is the XOR of the operand signs, including zero
      results (-2.0 * +0.0 = -0.0). An exactly-zero sum of opposite-signed
      addends is +0.0, and (-0.0) + (-0.0) = -0.0.
    - NaN rule: whenever IEEE 754 would produce a NaN, the result is exactly
      0x7FC00000, the RISC-V canonical quiet NaN. That covers any NaN operand
      (signalling or quiet, any sign or payload), Inf * 0 and Inf + (-Inf).
      The rule applies to p (and so to x[rd]) and to the new FACC.
    - No exception flags, no fcsr access, no traps.

    Timing: the latency from issue to result is a fixed constant of the
    implementation, independent of operand values and of FACC. There is no
    early-out for zero, Inf, NaN or subnormal operands. Normalisation uses
    fixed-depth leading-zero count and shift, and the significand product
    takes a fixed number of iterations. Non-normative: a radix-4 sequential
    24x24 significand multiplier (12 steps) plus align, add, normalise and round
    gives roughly 16-20 cycles and needs no second array multiplier beside
    fast_mul.

    Use in multiply::ijk_matmul (K = A.columns >= 1). Each output element
    issues K-1 xfmac.s x0, A[i][k], B[k][j], then one
    xfmacr.s rd, A[i][K], B[K][j], whose rd is stored to C[i][j]. Because
    FACC starts each element at +0.0, which is the value clearMatrix gives
    C[i][j], the result is bit-identical to the original loop.

    Worked sequences, from reset (FACC = 0x00000000):
      xfmac.s  t0, 0x3FC00000(1.5), 0x40000000(2.0) -> t0 = 0x40400000 (3.0),  FACC = 0x40400000
      xfmac.s  t0, 0x3E800000(0.25), 0xC0800000(-4) -> t0 = 0xBF800000 (-1.0), FACC = 0x40000000 (2.0)
      xfmacr.s t1, 0x3F800000(1.0), 0x3F000000(0.5) -> t1 = 0x40200000 (2.5),  FACC = 0x00000000
    Unfused rounding (distinguishes this from an FMA):
      xfmac.s  x0, 0xBF800002, 0x3F800000           -> FACC = 0xBF800002 (-(1+2^-22))
      xfmacr.s t1, 0x3F800001, 0x3F800001           -> p = 0x3F800002, t1 = 0x00000000 (+0.0; an FMA would give 0x28800000)
    Single-instruction vectors for x[rd] = p (FACC does not affect x[rd]):
      0x00000001 * 0x3F000000 -> 0x00000000 (2^-150 is a tie; rounds to even, +0)
      0x00000003 * 0x3F000000 -> 0x00000002 (tie 1.5*2^-149 rounds to even)
      0x7F7FFFFF * 0x40000000 -> 0x7F800000 (overflow to +Inf)
      0x7F800000 * 0x00000000 -> 0x7FC00000 (invalid, canonical NaN)
      0xFFC12345 * 0x3F800000 -> 0x7FC00000 (NaN payload and sign not propagated)
      0x80000000 * 0x3F800000 -> 0x80000000 (-0.0)
