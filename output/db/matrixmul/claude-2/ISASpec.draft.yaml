  replaces: multiply::ijk_matmul
  semantics: |
    xfmacr.s rd, rs1, rs2 performs the last multiply-accumulate of a dot
    product and hands the finished sum back. It computes p = x[rs1] * x[rs2]
    rounded to binary32, then s = FACC + p rounded to binary32. It writes s to
    x[rd] and resets FACC to +0.0 (0x00000000).

    Operand packing (register form): in[0] = x[rs1], in[1] = x[rs2], and
    out[0] -> x[rd]. out[1] is not architectural and the model writes it 0.
    Reading x0 gives 0x00000000 (+0.0). Both sources and FACC are read before
    rd and FACC are written. FACC is reset even when rd = x0.

    Arithmetic: exactly as for xfmac.s. That means a binary32 multiply, then a
    separate binary32 add (NOT fused), each with roundTiesToEven and gradual
    underflow, overflow to +/-Inf, and IEEE signed-zero rules. Any NaN result
    becomes exactly 0x7FC00000. No flags, no fcsr access, no traps. The
    latency is the same fixed, operand-independent constant as xfmac.s. The
    unit uses the same multiplier and adder.

    Idioms:
    - xfmacr.s rd, a, b: the final term of a dot product. x[rd] = the
      complete sum, and FACC is clean for the next one.
    - xfmacr.s x0, x0, x0: clear FACC (issued once on kernel entry).
    - xfmacr.s t, x0, x0: save. It returns fl(FACC + fl(+0 * +0)) = FACC
      exactly, because FACC is never -0.0. FACC is left +0.0.
    Because xfmacr.s always leaves FACC = +0.0, issuing it repeatedly from a
    clean state gives x[rd] = fl(+0.0 + fl(x[rs1] * x[rs2])) every time, a
    function of the operands alone.

    Worked sequences, from reset (FACC = 0x00000000):
      xfmac.s  x0, 0x3FC00000(1.5), 0x40000000(2.0)  -> FACC = 0x40400000 (3.0)
      xfmacr.s t1, 0x3F800000(1.0), 0x3F000000(0.5)  -> t1 = 0x40600000 (3.5), FACC = 0x00000000
      xfmacr.s t2, 0x80000000(-0.0), 0x3F800000(1.0) -> p = 0x80000000, t2 = 0x00000000 (+0 + -0 = +0), FACC = 0x00000000
      xfmac.s  x0, 0x7F800000(+Inf), 0x3F800000      -> FACC = 0x7F800000
      xfmacr.s t3, 0xFF800000(-Inf), 0x3F800000      -> t3 = 0x7FC00000 (Inf + -Inf), FACC = 0x00000000
      xfmacr.s t4, 0x00000003, 0x3F000000            -> t4 = 0x00000002 (subnormal tie to even)
    Unfused rounding (distinguishes this from an FMA):
      xfmac.s  x0, 0xBF800002, 0x3F800000            -> FACC = 0xBF800002
      xfmacr.s t5, 0x3F800001, 0x3F800001            -> t5 = 0x00000000 (an FMA would give 0x28800000)
