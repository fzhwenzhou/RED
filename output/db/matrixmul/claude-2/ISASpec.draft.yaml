    /* xfmacr.s rd, rs1, rs2: in[0] = x[rs1], in[1] = x[rs2], out[0] -> x[rd].
       p = RNE(x[rs1] * x[rs2]); x[rd] = RNE(FACC + p); FACC = +0.0.
       Any NaN result becomes 0x7FC00000 (branch-free select). */
    void xfmacr_s_model(const uint32_t in[2], uint32_t out[2])
    {
        xf_word a, b, p, c, s;
        uint32_t pm, sm;
        a.u = in[0];
        b.u = in[1];
        p.f = a.f * b.f;
        pm = (uint32_t)0 - (uint32_t)((p.u & 0x7FFFFFFFu) > 0x7F800000u);
        p.u = (p.u & ~pm) | (0x7FC00000u & pm);
        c.u = xf_facc;
        s.f = c.f + p.f;
