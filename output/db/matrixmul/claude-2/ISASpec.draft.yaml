name: 'RED-XFACC: binary32 dot-product accumulator for RV32IM'
passes_gate2: false
passes_link1: false
rationale: |
  S2a (pattern). The report has one hot function, multiply (68.3% of cycles,
  Amdahl ceiling 1/(1-0.683) = 3.15x). Its two mined regions are the ijk triple
  loop and the 100-store clearMatrix zero fill; Gate 3 credits them together as
  one function, and the zero fill is plain stores the base ISA already does well,
  so it stays in software. The ijk body is one recurring dataflow pattern: a
  binary32 dot product with sequential accumulation, c = fl(c + fl(a*b)), with
  c starting at +0.0 (clearMatrix) and K = A.columns terms per output element.
  On RV32IM both fl(a*b) and fl(c+p) are soft-float library calls.

  S2b (shape). A multiply-accumulate has three binary32 inputs (a, b and the
  running sum c), and a PCPI instruction gets two source registers. A pure
  two-register pair (an fmul.s/fadd.s in integer registers, Zfinx-style) needs two
  instructions per MAC. At the gate's ~31 cycles per register-form instruction
  that is ~62 cycles per MAC against ~79 cycles of credited software, which
  predicts ~1.19x for the application. Moving the third input into one
  architectural 32-bit accumulator (FACC) makes it one instruction per MAC, for
  32 bits of state (a "small" addition by the core profile's measure). Folding the
  read-out and clear into the last MAC of each dot product (xfmacr.s) removes a
  separate read instruction per output element. It also keeps both instructions
  observable and twice-call pure:
  xfmac.s returns the rounded product, which depends only on its operands, and
  xfmacr.s returns the finished sum and leaves FACC at +0.0. So from a clean
  accumulator its result is again a function of its operands alone.
  The same two instructions give clear (xfmacr.s x0, x0, x0), save
  (xfmacr.s t, x0, x0) and exact restore (xfmac.s x0, t, 1.0), so no third
  instruction is needed.

  Rejected: (1) block-form dot products or tile multiplies, which are
  memory-operand arithmetic and structurally blocked; (2) a tile register file
  holding rows of A/B, which costs hundreds to thousands of bits of state and has
  compute results that depend on state written by other instructions;
  (3) packed or quantised operand formats, which are not exact for general
  binary32 inputs and would change the application's results; (4) a fused
  multiply-add, which rounds once and so changes results relative to the C
  source; (5) any fixed matrix-size limit, which would truncate larger matrices.
  The instructions impose no limit on M, N or K.

  Cost (data-volume derivation). The profiled harness rotates the shapes
  (M,K,N) = (10,10,10), (8,12,8), (5,20,5), (9,9,9) over its 40,000 calls. That
  is M*K*N = 1000, 768, 500, 729 MACs (mean 749.25 per call) and M*N = 100, 64,
  25, 81 output elements (mean 67.5 per call). Each output element issues K-1
  xfmac.s and 1 xfmacr.s, and each call adds one xfmacr.s x0,x0,x0 on entry to
  guarantee a clean FACC. So per call: xfmac.s 749.25-67.5 = 681.75 -> 682
  invocations, and xfmacr.s 67.5+1 = 68.5 -> 69 invocations (both rounded up).
  Gate 3 cost: ~751 register-form invocations at ~31 cycles is ~23.3k cycles
  against 6,987 host Ir x 8.51 = ~59.5k cycles of credited software per call. That
  predicts ~2.55x on multiply and ~1.71x for the application. The real target's
  software side is soft-float (the host profile used hardware floating point),
  so the gain on PicoRV32 itself should be larger than the gate's figure. The
  gate's figure is the conservative one.

  Prior-run findings designed around: fused-vs-unfused mismatch (the semantics
  state two roundings and give a distinguishing vector); subnormals flushed to
  zero (gradual underflow is required and examples are given); data-dependent FP
  latency (the latency is fixed by specification); rd left undefined (both
  instructions always define x[rd]); dimension truncation (no size limit);
  custom-0 IRQ aliasing (custom-1 is used).
register_files:
- context: |
    Per-thread architectural state, 32 bits. Save: xfmacr.s t, x0, x0. This
    returns fl(FACC + fl(+0 * +0)) = FACC exactly and leaves FACC = +0.0.
    Restore (FACC is +0.0 after the save): xfmac.s x0, t, t1, with
    t1 = 0x3F800000 (1.0). This sets FACC = fl(+0 + fl(t*1.0)) = t exactly.
    Both identities are exact because FACC can never hold -0.0 and any NaN in
    FACC is already the canonical 0x7FC00000 (see state_note). On this
    core (ENABLE_IRQ=0) there is no preemption. Software keeps FACC at +0.0
    between dot products, because every accumulation chain ends with xfmacr.s.
  count: 1
  name: facc
  purpose: |
    The running binary32 sum of the dot product currently being formed.
    xfmac.s adds its rounded product into it. xfmacr.s adds its rounded
    product, returns the result in x[rd] and resets FACC to +0.0. This one
    register is what lets a three-input multiply-accumulate issue as one
    two-source R-type instruction.
  reset: 0x00000000 (+0.0)
  width_bits: 32
state_note: |
  FACC is the only state. It is written only by xfmac.s (FACC <- fl(FACC + p))
  and xfmacr.s (FACC <- +0.0), and reset sets it to +0.0.
  Invariants that follow from IEEE 754 round-to-nearest-even and are relied on
  above:
  (a) FACC never holds -0.0. An RNE sum is -0 only when both addends are -0,
      and FACC starts at +0. Also, a nonzero exact sum of two binary32 values
      is at least 2^-149 in magnitude, so it never rounds to zero.
  (b) Any NaN in FACC is 0x7FC00000.
  Residue: FACC is per-thread state and may hold a partial sum of one thread's
  data. Before another thread or privilege domain runs, the outgoing context
  must save it (xfmacr.s t, x0, x0, which also clears it) or clear it
  (xfmacr.s x0, x0, x0), so one context's partial sum never enters another's
  results. Within a thread, every chain that ends in xfmacr.s leaves it +0.0.
  The kernel issues one xfmacr.s x0, x0, x0 on entry, so it does not depend on
  the caller having done so.
  No instruction raises an exception, accesses memory, or reads or writes any
  CSR. There is no fcsr (the core has no F extension), the rounding mode is
  fixed at RNE, and no accrued-exception flags exist. This matches the libgcc
  soft-float routines being replaced, which on this target neither honour a
  dynamic rounding mode nor expose flags.
  Hardware binding: a PCPI unit that claims exactly opcode 0101011 with
  funct3=000 and funct7 in {0000100, 0000101}. It raises pcpi_wait in the cycle
  after pcpi_valid (well inside the 16-cycle timeout) and returns pcpi_wr=1 with
  pcpi_rd after a fixed latency. It never asserts acc_busy, so it never takes the
  memory bus. All other custom-1 encodings are left unclaimed and trap as
  illegal instructions (CATCH_ILLINSN=1). It never claims OP/funct7=0000001, so
  it cannot collide with fast_mul/div in the pcpi_int mux.
  Gate 2 runs each instruction alone from reset. That fully exercises the
  multiplier and rounding (xfmac.s returns p) and the product + 0 + clear
  path (xfmacr.s). Accumulation into a nonzero FACC is only observable across
  a sequence, so the worked sequences in each instruction's semantics are the
  reference for reviewers and for the RTL testbench.
