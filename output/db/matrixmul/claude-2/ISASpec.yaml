        xf_acc[2] = (c.u & ~m) | (0x7FC00000u & m);
        c.u = xf_acc[3];
        c.f = c.f + p11.f;
        m = (uint32_t)0 - (uint32_t)((c.u & 0x7FFFFFFFu) > 0x7F800000u);
        xf_acc[3] = (c.u & ~m) | (0x7FC00000u & m);
        m = (uint32_t)0 - (uint32_t)((p11.u & 0x7FFFFFFFu) > 0x7F800000u);
