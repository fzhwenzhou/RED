base_isa: rv32im + Zicntr (PicoRV32, COMPRESSED_ISA=0, ENABLE_IRQ=0, no F extension)
critic_rounds: 3
csrs: []
description: |
  Three register-to-register instructions in custom-1 over a 6-word unit
  state: four binary32 accumulators (FACC = C00, C01, C10, C11) and a 2-word
  operand latch (FLAT = LA, LB). Together they compute a 2x2 block of the
  binary32 matrix product in multiply::ijk_matmul (register blocking). Per k,
  the software loads A[i][k], A[i+1][k], B[k][j], B[k][j+1] and issues
  xfop.lo then xfop.hi, which perform all four multiply-accumulates
  C[r][c] += A[i+r][k]*B[k][j+c]. After the k loop, four xfop.rd drain the
  block into C. Each element accumulates its products in k order starting
  from +0.0, rounding the product and then the sum (NOT fused). That is
  exactly the C code's c + a*b, so the results are bit-identical to the
  original loop. The loop nest, the loads of A and B and the address
  arithmetic stay in software. No instruction touches memory.
  This replaces round 1's xfmac.s/xfmacr.s pair, which needed one instruction
  per MAC. Here it is 0.65.
encodings: []
gate2_vectors: 100000
instructions:
- c_model: |
    #include <stdint.h>

    /* Architectural state (register_files): xf_acc[0..3] = FACC C00, C01,
       C10, C11; xf_lat[0..1] = FLAT LA, LB. Every element resets to
       0x00000000. xfop.lo returns only its own product, so its result is a
       function of in[] alone. */
    static uint32_t xf_acc[4] = {0u, 0u, 0u, 0u};
    static uint32_t xf_lat[2] = {0u, 0u};

    typedef union { uint32_t u; float f; } xf_word;

    /* xfop.lo rd, rs1, rs2: in[0] = x[rs1] = a0, in[1] = x[rs2] = b0.
       p = RNE(a0*b0); C00 = canon(RNE(C00 + p)); LA = a0; LB = b0;
       out[0] = canon(p) -> x[rd]; out[1] = 0 (not architectural).
       canon() maps every NaN to 0x7FC00000 with a mask, not a branch. A NaN
       product makes the sum NaN, so canonicalising p before the add or not
       gives the same C00. */
    void xfop_lo_model(const uint32_t in[2], uint32_t out[2])
    {
        xf_word a, b, p, c;
        uint32_t m;
        a.u = in[0];
        b.u = in[1];
        p.f = a.f * b.f;
        c.u = xf_acc[0];
        c.f = c.f + p.f;
        m = (uint32_t)0 - (uint32_t)((c.u & 0x7FFFFFFFu) > 0x7F800000u);
        xf_acc[0] = (c.u & ~m) | (0x7FC00000u & m);
        xf_lat[0] = in[0];
        xf_lat[1] = in[1];
        m = (uint32_t)0 - (uint32_t)((p.u & 0x7FFFFFFFu) > 0x7F800000u);
        out[0] = (p.u & ~m) | (0x7FC00000u & m);
        out[1] = 0u;
    }
