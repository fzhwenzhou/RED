    write them 0, which is why funct7 is listed as 0000000. The decoder
    matches opcode 0101011 with funct3 = 001 only, so the instruction occupies
    the whole custom-1 funct3=001 slot. x[rs1] is not used (write x0).
      sel 0..3: x[rd] = FACC[sel] (C00, C01, C10, C11), then FACC[sel] = 0x00000000
      sel 4:    x[rd] = LA, then LA = 0x00000000
      sel 5:    x[rd] = LB, then LB = 0x00000000
      sel 6:    x[rd] = 0x00000000, no state change (reserved)
      sel 7:    x[rd] = 0x00000000, and all four FACC and both FLAT
                elements become 0x00000000 (clear all)
    The value moved is the raw 32-bit pattern, with no arithmetic. Because
    FACC only ever holds +0.0 or a canonical sum (see state_note), the value
    read from FACC is exactly the C element the original loop computes.
    Operand packing (reg_imm form): in[0] = x[rs1] (ignored), in[1] = the
    zero-extended immediate (the model uses in[1] & 7), out[0] -> x[rd]. out[1]
    is not architectural and the model writes it 0. If rd = x0 the value is
    discarded and the element is still cleared. That is how the entry/exit
    scrub xfop.rd x0, x0, 7 is issued.
    Timing: fixed (a 6-way select and a clear), independent of sel and of
    the state.
    Hardware note: PicoRV32 offers an I-type custom instruction on PCPI like
    any other, with pcpi_rs2 = x[insn[24:20]]. That value is meaningless here
    and the unit must take sel from pcpi_insn[22:20].

    Gate 2 tests each instruction alone from reset, and alone this one only
    ever sees a zero state, so it always returns 0. Its data path is checked
    by the sequences: in the xfop.hi worked sequence, sel 0..3 return
    0x40600000, 0xC0400000, 0x3FC00000, 0x40A00000. A second read of the
    same sel then returns 0x00000000. After xfop.lo x0, 0x3FC00000,
    0x40000000, sel 4 returns 0x3FC00000 and sel 5 returns 0x40000000. After
    sel 7, every sel returns 0.
  spike_model: |-
    void xfop_rd_iss(const uint32_t in[2], uint32_t out[2]) {
        (void)in;
        out[0] = 0;
        out[1] = 0;
    }
  src_regs: 1
  state_words: 0
  words: 2
  writes_state:
  - facc
  - flat
link1_vectors: 100000
name: 'RED-XFOP: binary32 2x2 outer-product accumulator for RV32IM'
passes_gate2: true
passes_link1: true
rationale: |
  S2a (pattern). One hot function, multiply, holds 68.3% of cycles, an Amdahl
  ceiling of 1/(1-0.683) = 3.15x. Its two mined regions are the ijk triple
  loop and the 100-store clearMatrix fill. Gate 3 credits them together as
  one function, and the fill is plain stores the base ISA already does well,
  so it stays in software. The ijk body is one dataflow pattern: a binary32
  dot product with sequential accumulation, c = fl(c + fl(a*b)), starting
  from +0.0. Without F, both operations are soft-float calls.

  Why round 1 fell short (1.71x). xfop's predecessor, xfmac.s/xfmacr.s, was
  bit-exact but issued one instruction per MAC. On this core every
  register-form instruction costs about 30 cycles of issue before it does
  anything, so the kernel cost was about 751 x 31 cycles. The only lever left
  is more MACs per issued instruction, and a 2-source instruction brings only
  two new binary32 values. The way to get more MACs out of the same values is
  operand reuse, which is what register blocking does in every BLAS kernel.

  S2b (shape). One k step of a 2x2 block of C needs four values (A[i][k],
  A[i+1][k], B[k][j], B[k][j+1]) and does four MACs. Two 2-source
  instructions carry the four values. Latching the first pair (FLAT) lets the
  second instruction form all three remaining products, so it is 2
  instructions per 4 MACs, and each value the software loads feeds two MACs.
  The split is lo = 1 MAC plus the latch, hi = 3 MACs. Each instruction
  returns its own a*b product, which is a function of its operands alone.
  That keeps both twice-call pure under Gate 4 and lets Gate 2 check the
  whole multiplier and rounding path on each of them in isolation. The four
  accumulators hold the 2x2 block's sums. xfop.rd drains them one per
  instruction, because PCPI returns one 32-bit value, and clears them as it
  goes, so each block starts from +0.0 exactly like clearMatrix. Sel 7 is
  the entry/exit scrub. The odd last row/column of the 5x5 and 9x9 shapes
  uses xfop.lo alone as a 1x1 step. Accumulation order per element is
  unchanged, so results are bit-identical to the C source. There is no limit
  on M, N or K.

  Rejected: (1) 2x4 or 4x4 blocking, which needs 10 or 20 words of state and
  pads badly on the 5- and 9-wide shapes, for about 10-15% more on the
  10x10 shape. (2) A raw write instruction into FACC for context restore.
  Its only kernel use would be 2 scrubs per call, which the invocations bound
  rejects, and sel 7 of xfop.rd already scrubs. On ENABLE_IRQ=0 the state
  never lives across a context switch. (3) Block-form dot products or tile
  multiplies, which are memory-operand arithmetic and structurally blocked.
  (4) A fused multiply-add, or packed or quantised operands, either of which
  changes the application's results. (5) A fixed matrix-size limit.

  Cost (data volume). The profile harness rotates (M,K,N) = (10,10,10),
  (8,12,8), (5,20,5), (9,9,9) over its 40,000 calls, so 1000, 768, 500 and 729
  MACs (mean 749.25). Per shape, with full 2x2 blocks plus 1x1 edges:
    10x10x10: 25 blocks -> lo 250, hi 250, rd 100
    8x12x8:   16 blocks -> lo 192, hi 192, rd 64
    5x20x5:   4 blocks + 9 edge elements -> lo 80+180 = 260, hi 80, rd 16+9 = 25
    9x9x9:    16 blocks + 17 edge elements -> lo 144+153 = 297, hi 144, rd 64+17 = 81
  Means: xfop.lo 249.75 -> 250, xfop.hi 166.5 -> 167, and xfop.rd 67.5
  drains + 2 scrubs = 69.5 -> 70 (all rounded up). Check:
  249.75 + 3 x 166.5 = 749.25 MACs, as required. That is 486 instructions
  per call, against 751 for round 1.
  Gate 3: about 250 x 31 + 167 x ~35 + 70 x ~36 = ~16.1k cycles (the last two
  include the model's sequential-step charge), against 6,987 host Ir x 8.51 =
  ~59.5k cycles of credited software per call. That predicts ~3.7x on
  multiply and ~2.0x for the application (round 1: 1.71x; ceiling 3.15x).
  Honest caveat: Gate 3 prices a MAC at 1 cycle, but a sequential binary32
  datapath takes ~16-20 cycles per multiply-add, so xfop.hi is really about
  3x slower than xfop.lo. On PicoRV32 the win still holds, for reasons the
  gate's model does not see. The issue count per MAC falls from 1.0 to 0.65.
  The software loads per MAC fall from 2 to 1 in the blocked region, at ~5
  cycles each. And every libgcc soft-float call disappears.

  Prior-run findings designed around: fused-vs-unfused mismatch (two
  roundings, with a distinguishing vector); subnormal flush (gradual
  underflow required); data-dependent FP latency (fixed by specification);
  rd left undefined (every instruction defines x[rd]); dimension truncation
  (no size limit); custom-0 IRQ aliasing (custom-1 used); Gate 4's twice-call
  purity (no output depends on state its own instruction changes).
register_files:
- context: |
    Scratch state, not saved or restored. It is live only inside one 2x2
    block, from that block's first xfop.lo to its last xfop.rd drain, and
    nothing on this core can interrupt that window. ENABLE_IRQ=0, and the
    loads, address arithmetic and custom instructions in the window cannot
    trap. Software treats it as clobbered across any call, ecall or trap.
    Every context switch, and the kernel itself on entry and exit, issues
    xfop.rd x0, x0, 7, so no partial sum of one caller reaches another. A
    core with preemptive interrupts would need a write path for save/restore.
    This version targets the ENABLE_IRQ=0 build and does not provide one.
  count: 4
  name: facc
  purpose: |
    The four binary32 running sums of the 2x2 block of C being formed:
    FACC[0] = C00 = C[i][j], FACC[1] = C01 = C[i][j+1], FACC[2] = C10 =
    C[i+1][j], FACC[3] = C11 = C[i+1][j+1]. Written by xfop.lo (C00) and
    xfop.hi (C01, C10, C11), drained by xfop.rd sel 0..3. These four
    registers let a 3-input multiply-accumulate issue as a 2-source R-type
    instruction, and let each A and B element the software loads feed two
    MACs instead of one.
  reset: 0x00000000 (+0.0) in every element
  width_bits: 32
- context: |
    Same as facc: scratch, live only between an xfop.lo and the xfop.hi
    issued right after it. Scrubbed by xfop.rd x0, x0, 7 at kernel exit and
    on any context switch, so the last A/B operands of one caller are not
    left in the unit.
  count: 2
  name: flat
  purpose: |
    The operand latch: FLAT[0] = LA = the a0 and FLAT[1] = LB = the b0 of the
    most recent xfop.lo, as raw 32-bit patterns. xfop.hi reads them to form
    the two cross products LA*b1 and a1*LB, so one k step needs only two
    2-source instructions for four MACs. Readable and clearable through
    xfop.rd sel 4, 5 and 7.
  reset: 0x00000000 in both elements
  width_bits: 32
state_note: |
  The state is FACC (4 x 32) and FLAT (2 x 32), 192 bits in all, a fifth of
  the core's 1,024-bit register file. There are no CSRs. Writers: xfop.lo
  (C00, LA, LB), xfop.hi (C01, C10, C11) and xfop.rd (clears the element it
  reads, or everything with sel 7). Reset clears everything.
  Invariants, which follow from IEEE 754 roundTiesToEven and from the
  absence of any raw write path into FACC:
  (a) FACC never holds -0.0. Every element starts at +0.0 (reset, drain or
      clear), an RNE sum is -0 only when both addends are -0, and a nonzero
      exact sum of two binary32 values is at least 2^-149 in magnitude, so it
      never rounds to zero.
  (b) Any NaN in FACC is exactly 0x7FC00000.
  Together these make the drained value bit-identical to the C variable the
  original loop accumulates from clearMatrix's +0.0.
  Interaction through the state, which Gate 2 cannot see because it runs
  each instruction alone from reset: xfop.hi consumes the LA/LB written by
  the preceding xfop.lo, xfop.rd returns what lo/hi accumulated, and a drain
  leaves an element at +0.0 ready for the next block. The worked sequences
  in xfop.hi and xfop.rd are the reference for reviewers and for the RTL
  testbench. Each model holds its own copy of the state, and no instruction's
  output depends on state that the same instruction changes. xfop.lo and
  xfop.hi return their own a*b product, and xfop.rd alone from reset only
  ever sees zeros. So every model is a pure function of in[] under repeated
  calls.
  Residue: the kernel issues xfop.rd x0, x0, 7 on entry, so its results never
  depend on what an earlier caller left, and again on exit, so no operand or
  partial sum outlives the call.
  No instruction raises an exception, accesses memory, or reads or writes any
  CSR. There is no fcsr (the core has no F extension), the rounding mode is
  fixed at RNE, and no accrued-exception flags exist. This matches the libgcc
  soft-float routines being replaced, which on this target neither honour a
  dynamic rounding mode nor expose flags.
  Hardware binding: one PCPI unit claims opcode 0101011 with (funct3 = 000
  and funct7 in {0001000, 0001001}) or funct3 = 001. It raises pcpi_wait in
  the cycle after pcpi_valid, well inside the 16-cycle timeout, and returns
  pcpi_wr=1 with pcpi_rd after a fixed latency. It never asserts acc_busy, so
  it never takes the memory bus, and it never claims OP/funct7=0000001, so it
  cannot collide with fast_mul/div. Every other custom-1 encoding is left
  unclaimed and traps as illegal (CATCH_ILLINSN=1). Non-normative datapath:
  one binary32 multiply-add unit with a radix-4 sequential 24x24 significand
  multiplier (12 steps; no second array multiplier beside fast_mul), then
  align, add, normalise and round, about 16-20 cycles per multiply-add.
  xfop.lo uses it once and xfop.hi three times back to back.
tests:
- 'link1: coverage 100.00% >= 80%; 3/3 C models built and survived 100,000 vectors under ASan+UBSan'
- 'gate2: 3/3 instructions: C model and patched Spike agree on 100,000 random + corner vectors'
version: 0.2.0
